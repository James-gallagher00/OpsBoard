<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OpsBoard</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%236366f1'/><rect x='1' y='1' width='6' height='6' rx='1' fill='white' opacity='0.9'/><rect x='9' y='1' width='6' height='6' rx='1' fill='white' opacity='0.6'/><rect x='1' y='9' width='6' height='6' rx='1' fill='white' opacity='0.6'/><rect x='9' y='9' width='6' height='6' rx='1' fill='white' opacity='0.9'/></svg>"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#0a0f1e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e2e8f0}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:#0f172a}
    ::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:#334155}
    textarea:focus,input:focus,select:focus{outline:none}
    .badge-critical{background:#450a0a;color:#fca5a5;border:1px solid #7f1d1d}
    .badge-high{background:#431407;color:#fdba74;border:1px solid #7c2d12}
    .badge-medium{background:#1c1917;color:#d6d3d1;border:1px solid #44403c}
    .badge-low{background:#0c4a6e;color:#7dd3fc;border:1px solid #075985}
    .status-todo{background:#1e293b;color:#94a3b8;border:1px solid #334155}
    .status-inprogress{background:#1e3a5f;color:#93c5fd;border:1px solid #1d4ed8}
    .status-review{background:#2e1065;color:#c4b5fd;border:1px solid #6d28d9}
    .status-blocked{background:#450a0a;color:#fca5a5;border:1px solid #7f1d1d}
    .status-done{background:#052e16;color:#86efac;border:1px solid #166534}
    .overdue{background:#450a0a;color:#fca5a5;border:1px solid #7f1d1d}
    .due-soon{background:#431407;color:#fdba74;border:1px solid #7c2d12}
    .fade-in{animation:fadeIn .15s ease-in}
    .slide-in{animation:slideIn .2s ease-out}
    .toast-slide{animation:toastIn .25s ease-out}
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
    @keyframes toastIn{from{opacity:0;transform:translateX(120%)}to{opacity:1;transform:translateX(0)}}
    .task-row{transition:background .1s}
    .task-row:hover{background:#111827}
    .glow{box-shadow:0 0 20px rgba(99,102,241,.15)}
    .kanban-col{min-height:300px}
    .glass{background:rgba(15,23,42,.7);backdrop-filter:blur(12px);border:1px solid rgba(99,102,241,.15)}
    .pulse-dot{animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .kbd{display:inline-flex;align-items:center;justify-content:center;background:#1e293b;border:1px solid #334155;border-radius:4px;padding:1px 5px;font-size:10px;color:#94a3b8;font-family:monospace}
    .search-highlight{background:rgba(99,102,241,.3);border-radius:2px}
    input[type=search]::-webkit-search-cancel-button{display:none}
    .progress-ring{transform:rotate(-90deg)}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Constants ──────────────────────────────────────────────────────────────
const STATUSES   = ["Todo","In Progress","Review","Blocked","Done"];
const PRIORITIES = ["Critical","High","Medium","Low"];
const CAT_COLORS = {
  Vulnerability:"text-red-400",Deployment:"text-blue-400",Security:"text-purple-400",
  Incident:"text-orange-400",Compliance:"text-yellow-400",Infrastructure:"text-cyan-400",
  Monitoring:"text-emerald-400",Patch:"text-pink-400"
};
const DEFAULT_SETTINGS = {
  appName:"OpsBoard", domain:"", userName:"", initials:"",
  assignees:["Unassigned"],
  categories:["Vulnerability","Deployment","Security","Incident","Compliance","Infrastructure","Monitoring","Patch"],
  accentColor:"#6366f1"
};
const SEED_TASKS = [];

// ══════════════════════════════════════════════════════════════════════════
// ██  AZURE CONFIGURATION  — fill in your values here
// ══════════════════════════════════════════════════════════════════════════
const AZURE = {
  // ▶ EDIT 1 — Your Azure Functions App base URL (no trailing slash)
  //   Azure Portal → Function App → Overview → URL
  //   e.g. "https://opsboard-api.azurewebsites.net/api"
  functionsUrl: "https://opsboardlogic.azurewebsites.net/api",

  // ▶ EDIT 2 — Your Azure Blob Storage account name
  //   Azure Portal → Storage accounts → your account → name
  //   e.g. "opsboardstorage"
  storageAccount: "opsboardstorage",

  // ▶ EDIT 3 — Container name (create manually in your storage account)
  //   Azure Portal → Storage Account → Containers → + Container → name below
  storageContainer: "opsboard-data",               // ← change if you name it differently

  // ▶ EDIT 4 — Azure AD App Registration → Overview → Application (client) ID
  //   Azure Portal → Azure Active Directory → App registrations → your app → Overview
  //   e.g. "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
  clientId: "ef58aa0d-fa22-46aa-9536-fba4a52a90ff",

  // ▶ EDIT 5 — Azure AD App Registration → Overview → Directory (tenant) ID
  //   Same page as above
  //   e.g. "ffffffff-eeee-dddd-cccc-bbbbbbbbbbbb"
  tenantId: "f7ffe647-4a1c-4a1f-94da-9c6570990491",
};

// Returns true only when required values have been filled in
const azureConfigured = () =>
  !AZURE.functionsUrl.includes("YOUR_") && !AZURE.storageAccount.includes("YOUR_");
const msalConfigured = () =>
  !AZURE.clientId.includes("YOUR_") && !AZURE.tenantId.includes("YOUR_");

// MSAL instance — created lazily on first Microsoft sign-in attempt
let _msalInstance = null;
const getMsal = () => {
  if (_msalInstance) return _msalInstance;
  if (!msalConfigured()) return null;
  _msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId: AZURE.clientId,
      authority: `https://login.microsoftonline.com/${AZURE.tenantId}`,
      redirectUri: window.location.origin + window.location.pathname,
    },
    cache: { cacheLocation: "sessionStorage", storeAuthStateInCookie: false },
  });
  return _msalInstance;
};
// ══════════════════════════════════════════════════════════════════════════

// ── Storage Service ────────────────────────────────────────────────────────
// Writes/reads JSON blobs to Azure Blob Storage using a per-user SAS token.
// Falls back to localStorage automatically if Azure is unreachable or not configured.
const StorageService = {
  _sasToken: null,
  _userId:   null,
  _mode:     "local", // "azure" | "local" | "memory"

  init(userId, sasToken) {
    this._userId   = userId;
    this._sasToken = sasToken;
    this._mode     = (userId && sasToken && azureConfigured()) ? "azure" : "local";
  },

  _url(key) {
    // Blob path: {container}/{userId}/{key}.json?{sasToken}
    return `https://${AZURE.storageAccount}.blob.core.windows.net/${AZURE.storageContainer}/${this._userId}/${key}.json?${this._sasToken}`;
  },

  async save(key, data) {
    if (this._mode === "azure") {
      try {
        const res = await fetch(this._url(key), {
          method: "PUT",
          headers: { "x-ms-blob-type": "BlockBlob", "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (res.ok) return "azure";
        if (res.status === 403) {
          // SAS token expired — clear session so user is prompted to re-login
          localStorage.removeItem("opsboard_session");
          this._mode = "local";
          console.warn("Session expired — please sign in again.");
        } else {
          throw new Error(res.statusText);
        }
      } catch (e) {
        console.warn("Cloud save failed, using local fallback:", e.message);
        this._mode = "local";
      }
    }
    try { localStorage.setItem(`opsboard_${key}`, JSON.stringify(data)); return "local"; }
    catch { return "memory"; }
  },

  async load(key, defaultVal) {
    if (this._mode === "azure") {
      try {
        const res = await fetch(this._url(key));
        if (res.ok) return await res.json();
        if (res.status === 403) {
          // SAS token expired — clear session so user is prompted to re-login
          localStorage.removeItem("opsboard_session");
          this._mode = "local";
          console.warn("Session expired — please sign in again.");
        } else if (res.status !== 404) {
          throw new Error(res.statusText);
        }
        return defaultVal; // 404 = no data yet, that's fine
      } catch (e) {
        console.warn("Cloud load failed, using local fallback:", e.message);
        this._mode = "local";
      }
    }
    try { const s = localStorage.getItem(`opsboard_${key}`); return s ? JSON.parse(s) : defaultVal; }
    catch { return defaultVal; }
  },

  mode() { return this._mode; },
};

// ── Auth Service ───────────────────────────────────────────────────────────
// Calls your Azure Functions for login/register.
// ▶ Your Function at /auth/login  must accept:  POST { email, password }
// ▶ Your Function at /auth/register must accept: POST { email, password, displayName }
// ▶ Both must return: { token, userId, displayName, sasToken }
//   where sasToken is a SAS query string for the user's blob directory.
const AuthService = {
  _token: null,
  _user:  null,

  // Extracts a human-friendly message from an API error response.
  // API returns { error: "..." }, fallback to status-based messages.
  async _parseError(res) {
    const statusMessages = {
      400: "Please check your details and try again.",
      401: "Incorrect email or password.",
      403: "You don't have permission to do that.",
      404: "Account not found.",
      409: "An account with this email already exists.",
      429: "Too many attempts. Please wait a moment and try again.",
      500: "Something went wrong on our end. Please try again shortly.",
    };
    try {
      const body = await res.json();
      return body.error || body.message || statusMessages[res.status] || "Something went wrong. Please try again.";
    } catch {
      return statusMessages[res.status] || "Something went wrong. Please try again.";
    }
  },

  async login(email, password) {
    const res = await fetch(`${AZURE.functionsUrl}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    if (!res.ok) throw new Error(await this._parseError(res));
    return this._apply(await res.json(), email);
  },

  async register(email, password, displayName) {
    const res = await fetch(`${AZURE.functionsUrl}/auth/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password, name: displayName }),
    });
    if (!res.ok) throw new Error(await this._parseError(res));
    return this._apply(await res.json(), email);
  },

  // ── Microsoft SSO ──────────────────────────────────────────────────────
  async msalLogin() {
    const msal = getMsal();
    if (!msal) throw new Error("Work account sign-in is not available.");
    await msal.initialize();
    const result = await msal.loginPopup({ scopes: ["openid","profile","email"] });
    const res = await fetch(`${AZURE.functionsUrl}/auth/microsoft`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ idToken: result.idToken }),
    });
    if (!res.ok) throw new Error(await this._parseError(res));
    return this._apply(await res.json(), result.account.username);
  },

  // ── Forgot password ────────────────────────────────────────────────────
  async forgotPassword(email) {
    const res = await fetch(`${AZURE.functionsUrl}/auth/forgot-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    if (!res.ok) throw new Error(await this._parseError(res));
    return true;
  },

  // ── Reset password ──────────────────────────────────────────────────────
  async resetPassword(token, newPassword) {
    const res = await fetch(`${AZURE.functionsUrl}/auth/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, newPassword }),
    });
    if (!res.ok) throw new Error(await this._parseError(res));
    return true;
  },

  _apply(data, email) {
    this._token = data.token;
    const u     = data.user || {};
    this._user  = { id: u.id || data.userId, name: u.name || data.displayName, email };
    StorageService.init(this._user.id, data.sasToken);
    localStorage.setItem("opsboard_session", JSON.stringify({ token: data.token, user: this._user, sasToken: data.sasToken }));
    return this._user;
  },

  restoreSession() {
    try {
      const raw = localStorage.getItem("opsboard_session");
      if (!raw) return null;
      const { token, user, sasToken } = JSON.parse(raw);
      this._token = token; this._user = user;
      StorageService.init(user.id, sasToken);
      return user;
    } catch { return null; }
  },

  logout() {
    this._token = null; this._user = null;
    StorageService.init(null, null);
    localStorage.removeItem("opsboard_session");
  },

  get user() { return this._user; },
};

// ── Helpers ────────────────────────────────────────────────────────────────
const pc = p => p==="Critical"?"badge-critical":p==="High"?"badge-high":p==="Medium"?"badge-medium":"badge-low";
const sc = s => s==="Todo"?"status-todo":s==="In Progress"?"status-inprogress":s==="Review"?"status-review":s==="Blocked"?"status-blocked":"status-done";
const cc = c => CAT_COLORS[c]||"text-slate-400";
const today = () => new Date().toISOString().slice(0,10);
const isOverdue  = d => d && d < today() ? true : false;
const isDueSoon  = d => { if (!d) return false; const diff=(new Date(d)-new Date())/86400000; return diff>=0&&diff<=3; };
const dueBadge   = d => isOverdue(d) ? "overdue" : isDueSoon(d) ? "due-soon" : "";
const initials   = n => n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
const fmtDate    = d => { if (!d) return "—"; const dt=new Date(d+"T00:00:00"); return dt.toLocaleDateString("en-GB",{day:"numeric",month:"short"}); };

// ── Toast System ───────────────────────────────────────────────────────────
function ToastContainer({ toasts, dismiss }) {
  return ReactDOM.createPortal(
    <div className="fixed bottom-4 right-4 flex flex-col gap-2 z-50">
      {toasts.map(t => (
        <div key={t.id} onClick={()=>dismiss(t.id)}
          className={`toast-slide flex items-center gap-3 px-4 py-3 rounded-lg shadow-xl cursor-pointer border text-sm font-medium
            ${t.type==="success"?"bg-emerald-950 border-emerald-800 text-emerald-300":
              t.type==="error"?"bg-red-950 border-red-800 text-red-300":
              t.type==="warn"?"bg-orange-950 border-orange-800 text-orange-300":
              "bg-slate-800 border-slate-700 text-slate-200"}`}>
          <span>{t.type==="success"?"✓":t.type==="error"?"✕":t.type==="warn"?"⚠":"ℹ"}</span>
          <span>{t.message}</span>
        </div>
      ))}
    </div>,
    document.body
  );
}
function useToast() {
  const [toasts, setToasts] = useState([]);
  const toast = useCallback((message, type="info") => {
    const id = Date.now()+Math.random();
    setToasts(ts=>[...ts,{id,message,type}]);
    setTimeout(()=>setToasts(ts=>ts.filter(t=>t.id!==id)),3000);
  },[]);
  const dismiss = useCallback(id=>setToasts(ts=>ts.filter(t=>t.id!==id)),[]);
  return { toasts, toast, dismiss };
}

// ── Confirm Modal ──────────────────────────────────────────────────────────
function ConfirmModal({ title, message, confirmLabel="Confirm", danger=false, onConfirm, onCancel, accentColor }) {
  return ReactDOM.createPortal(
    <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 fade-in"
      onClick={e=>e.target===e.currentTarget&&onCancel()}>
      <div className="glass rounded-xl w-full max-w-sm p-6 shadow-2xl">
        <h3 className="text-white font-semibold text-base mb-2">{title}</h3>
        <p className="text-slate-400 text-sm mb-6">{message}</p>
        <div className="flex gap-3">
          <button onClick={onCancel} className="flex-1 py-2 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium border border-slate-700">Cancel</button>
          <button onClick={onConfirm}
            className={`flex-1 py-2 rounded-md text-sm font-semibold ${danger?"bg-red-700 hover:bg-red-600 text-white":"text-white hover:opacity-90"}`}
            style={danger?{}:{background:accentColor}}>{confirmLabel}</button>
        </div>
      </div>
    </div>, document.body
  );
}

// ── Search Bar ─────────────────────────────────────────────────────────────
function SearchBar({ value, onChange, onClose }) {
  const ref = useRef();
  useEffect(()=>{ ref.current?.focus(); },[]);
  return (
    <div className="flex items-center gap-2 bg-slate-800 border border-indigo-500/50 rounded-lg px-3 py-1.5 w-72">
      <svg className="w-3.5 h-3.5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input ref={ref} type="search" value={value} onChange={e=>onChange(e.target.value)}
        className="bg-transparent text-white text-sm flex-1 placeholder-slate-500"
        placeholder="Search tasks… (Esc to close)"/>
      {value && <button onClick={()=>onChange("")} className="text-slate-500 hover:text-slate-300 text-xs">✕</button>}
    </div>
  );
}

// ── TopNav ─────────────────────────────────────────────────────────────────
function TopNav({ activeTab, setActiveTab, onNew, settings, tasks, search, setSearch, showSearch, setShowSearch, storageMode, user, onLogout }) {
  const tabs = ["Dashboard","Backlog","Board","Incidents","Vulnerabilities","Settings"];
  const badgeCount = tab => {
    if (tab==="Incidents") return tasks.filter(t=>t.category==="Incident"&&t.status!=="Done").length;
    if (tab==="Vulnerabilities") return tasks.filter(t=>t.category==="Vulnerability"&&t.status!=="Done").length;
    const overdue = tasks.filter(t=>t.status!=="Done"&&isOverdue(t.dueDate)).length;
    if (tab==="Dashboard" && overdue>0) return overdue;
    return 0;
  };
  return (
    <nav className="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur select-none flex-shrink-0 z-40">
      {/* Top bar: logo + controls */}
      <div className="flex items-center gap-2 px-3 h-12">
        <div className="flex items-center gap-1.5 flex-shrink-0">
          <div className="w-6 h-6 rounded flex items-center justify-center shadow-lg" style={{background:settings.accentColor}}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <rect x="1" y="1" width="5" height="5" rx="1" fill="white" opacity="0.9"/>
              <rect x="8" y="1" width="5" height="5" rx="1" fill="white" opacity="0.6"/>
              <rect x="1" y="8" width="5" height="5" rx="1" fill="white" opacity="0.6"/>
              <rect x="8" y="8" width="5" height="5" rx="1" fill="white" opacity="0.9"/>
            </svg>
          </div>
          <span className="font-bold text-white text-sm tracking-tight">
            {settings.appName.slice(0,-5)||"Ops"}
            <span style={{color:settings.accentColor}}>{settings.appName.slice(-5)||"Board"}</span>
          </span>
          {settings.domain && <span className="hidden sm:inline ml-1 text-xs text-slate-500 font-mono bg-slate-800 border border-slate-700 px-1.5 py-0.5 rounded-full">{settings.domain}</span>}
        </div>
        <div className="flex-1"/>
        <div className="flex items-center gap-1.5 flex-shrink-0">
          {showSearch
            ? <SearchBar value={search} onChange={setSearch} onClose={()=>{setShowSearch(false);setSearch("");}}/>
            : <>
                <button onClick={()=>setShowSearch(true)}
                  className="p-1.5 rounded-md text-slate-400 hover:text-white transition-colors" title="Search (/)">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </button>
                {activeTab!=="Settings" &&
                  <button onClick={onNew}
                    className="flex items-center gap-1 px-2.5 py-1.5 rounded-md text-white text-sm font-medium hover:opacity-90 transition-all shadow-lg"
                    style={{background:settings.accentColor}} title="New Task (N)">
                    <span className="text-base leading-none">+</span>
                    <span className="hidden sm:inline"> New Task</span>
                  </button>
                }
                {storageMode && <StorageBadge mode={storageMode}/>}
                <div className="flex items-center gap-1.5">
                  <div className="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white flex-shrink-0" style={{background:settings.accentColor+"cc"}}>
                    {settings.initials}
                  </div>
                  <span className="hidden md:inline text-sm text-slate-300">{settings.userName}</span>
                </div>
                {onLogout && user?.id !== "local" && (
                  <button onClick={onLogout} title="Sign out"
                    className="text-slate-600 hover:text-slate-300 text-xs px-2 py-1 rounded hover:bg-slate-800 transition-colors">
                    Sign out
                  </button>
                )}
              </>
          }
        </div>
      </div>
      {/* Scrollable tab strip */}
      {!showSearch && (
        <div className="flex overflow-x-auto border-t border-slate-800/60" style={{scrollbarWidth:"none",msOverflowStyle:"none"}}>
          {tabs.map(t=>{
            const badge = badgeCount(t);
            return (
              <button key={t} onClick={()=>setActiveTab(t)}
                className={`relative flex-shrink-0 h-10 px-4 text-sm font-medium transition-all border-b-2 whitespace-nowrap ${activeTab===t?"text-indigo-400":"border-transparent text-slate-400 hover:text-slate-200"}`}
                style={activeTab===t?{borderColor:settings.accentColor,color:settings.accentColor}:{borderColor:"transparent"}}>
                {t}
                {badge>0 && <span className="absolute top-1.5 right-1 w-4 h-4 rounded-full bg-red-600 text-white text-[9px] font-bold flex items-center justify-center">{badge>9?"9+":badge}</span>}
              </button>
            );
          })}
        </div>
      )}
    </nav>
  );
}

// ── Search Results ─────────────────────────────────────────────────────────
function SearchResults({ tasks, query, onSelect, settings }) {
  if (!query.trim()) return null;
  const q = query.toLowerCase();
  const results = tasks.filter(t=>
    t.title.toLowerCase().includes(q)||t.description.toLowerCase().includes(q)||
    t.category.toLowerCase().includes(q)||t.tags.some(tg=>tg.toLowerCase().includes(q))
  ).slice(0,8);
  return (

                  <span className="text-slate-200 text-sm font-medium flex-1">{t.title}</span>
                  <div className="flex gap-1.5 flex-shrink-0">

      }
    </div>
  );
}

// ── Dashboard ──────────────────────────────────────────────────────────────
function Dashboard({ tasks, onSelect, settings }) {
  const open     = tasks.filter(t=>t.status!=="Done");
  const overdue  = open.filter(t=>isOverdue(t.dueDate));
  const dueSoon  = open.filter(t=>isDueSoon(t.dueDate));
  const critical = open.filter(t=>t.priority==="Critical");
  const pct      = tasks.length ? Math.round((tasks.filter(t=>t.status==="Done").length/tasks.length)*100) : 0;
  const r=28, circ=2*Math.PI*r;
  const stats = [
    {label:"Open",value:open.length,color:"text-indigo-400",bg:"bg-indigo-950/60",border:"border-indigo-900/50"},
    {label:"Overdue",value:overdue.length,color:"text-red-400",bg:"bg-red-950/60",border:"border-red-900/50"},
    {label:"Due Soon",value:dueSoon.length,color:"text-orange-400",bg:"bg-orange-950/60",border:"border-orange-900/50"},
    {label:"Critical",value:critical.length,color:"text-pink-400",bg:"bg-pink-950/60",border:"border-pink-900/50"},
  ];
  const byStatus = STATUSES.map(s=>({status:s,count:tasks.filter(t=>t.status===s).length}));
  const recent = [...tasks].sort((a,b)=>b.id-a.id).slice(0,5);
  return (
    <div className="p-4 sm:p-6 fade-in max-w-6xl mx-auto">

        <span className="text-slate-500 text-xs">{new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</span>
      </div>

      {/* Stat cards — 2 cols on mobile, 4 on desktop */}
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
        {stats.map(s=>(
          <div key={s.label} className={`${s.bg} border ${s.border} rounded-xl p-4`}>
            <div className={`text-3xl font-bold ${s.color} mb-0.5`}>{s.value}</div>
            <div className="text-slate-400 text-sm">{s.label}</div>
            {s.label==="Overdue"&&s.value>0&&(
              <div className="mt-1.5 flex items-center gap-1 text-xs text-red-400">
                <span className="pulse-dot w-1.5 h-1.5 rounded-full bg-red-500 inline-block"/>
                Needs attention
              </div>
            )}
          </div>
        ))}
      </div>

      {/* Overdue alert — shown early on mobile so it's not buried */}
      {overdue.length>0&&(
        <div className="glass rounded-xl p-4 border border-red-900/50 mb-4">
          <h3 className="text-red-400 font-medium text-sm mb-2 flex items-center gap-2">
            <span className="pulse-dot w-2 h-2 rounded-full bg-red-500 inline-block"/>
            {overdue.length} Overdue Task{overdue.length>1?"s":""}
          </h3>
          <div className="flex flex-col gap-2">
            {overdue.map(t=>(
              <div key={t.id} onClick={()=>onSelect(t.id)}
                className="flex items-center gap-3 cursor-pointer hover:opacity-80">
                <span className={`text-xs px-2 py-0.5 rounded-full font-medium flex-shrink-0 ${pc(t.priority)}`}>{t.priority}</span>
                <span className="text-slate-300 text-sm flex-1 truncate">{t.title}</span>
                <span className="text-red-400 text-xs font-mono flex-shrink-0">{fmtDate(t.dueDate)}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Progress + Status — stack on mobile, side by side on sm+ */}
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        {/* Progress ring */}
        <div className="glass rounded-xl p-5 flex items-center gap-5">
          <svg width="72" height="72" className="progress-ring flex-shrink-0">
            <circle cx="36" cy="36" r={r} fill="none" stroke="#1e293b" strokeWidth="6"/>
            <circle cx="36" cy="36" r={r} fill="none" stroke={settings.accentColor} strokeWidth="6"
              strokeDasharray={circ} strokeDashoffset={circ*(1-pct/100)} strokeLinecap="round"
              style={{transition:"stroke-dashoffset .6s ease"}}/>
          </svg>
          <div>
            <div className="text-3xl font-bold text-white">{pct}%</div>
            <div className="text-slate-400 text-sm mt-0.5">Completion rate</div>
            <div className="text-slate-500 text-xs mt-1">{tasks.filter(t=>t.status==="Done").length} of {tasks.length} tasks done</div>
          </div>
        </div>

        {/* Status breakdown */}
        <div className="glass rounded-xl p-4">
          <h3 className="text-slate-300 font-medium text-sm mb-3">By Status</h3>
          <div className="flex flex-col gap-2">
            {byStatus.map(({status,count})=>(
              <div key={status} className="flex items-center gap-2">
                <span className={`text-xs px-2 py-0.5 rounded-full font-medium flex-shrink-0 w-20 text-center ${sc(status)}`}>{status}</span>
                <div className="flex-1 bg-slate-800 rounded-full h-1.5">

            ))}

        </div>

      {/* Recent Activity */}

        <h3 className="text-slate-300 font-medium text-sm mb-3">Recent Activity</h3>
        <div className="flex flex-col gap-2">
          {recent.map(t=>(
            <div key={t.id} onClick={()=>onSelect(t.id)}
              className="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity">

              <span className="text-slate-300 text-sm truncate flex-1">{t.title}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Tasks by Category */}
      <div className="glass rounded-xl p-4">
        <h3 className="text-slate-300 font-medium text-sm mb-3">Tasks by Category</h3>
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2">
          {settings.categories.map(cat=>{
            const all=tasks.filter(t=>t.category===cat);
            const done=all.filter(t=>t.status==="Done").length;
            if(!all.length)return null;
            return (
              <div key={cat} className="bg-slate-800/60 border border-slate-700/50 rounded-lg px-3 py-2.5">
                <div className={`text-xs font-medium ${cc(cat)} mb-1.5 truncate`}>{cat}</div>

                  <span className="text-slate-500 text-xs">{done} done</span>
                </div>
                <div className="bg-slate-700 rounded-full h-1">
                  <div className="h-1 rounded-full" style={{width:all.length?`${(done/all.length)*100}%`:"0%",background:settings.accentColor}}/>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ── Backlog ────────────────────────────────────────────────────────────────
function Backlog({ tasks, onSelect, selectedId, settings, toast }) {
  const [filterCat, setFilterCat]     = useState("All");
  const [filterStatus, setFilterStatus] = useState("All");
  const [sort, setSort]               = useState("id");
  const [sortDir, setSortDir]         = useState("desc");
  const [quickFilter, setQuickFilter] = useState("all");
  const allCats = ["All",...settings.categories];
  const todayStr = today();
  const weekEnd  = new Date(); weekEnd.setDate(weekEnd.getDate()+7);
  const weekStr  = weekEnd.toISOString().slice(0,10);

  let filtered = tasks.filter(t=>
    (filterCat==="All"||t.category===filterCat)&&
    (filterStatus==="All"||t.status===filterStatus)
  );
  if (quickFilter==="mine")       filtered=filtered.filter(t=>t.assignee===settings.assignees[0]);
  if (quickFilter==="overdue")    filtered=filtered.filter(t=>t.status!=="Done"&&isOverdue(t.dueDate));
  if (quickFilter==="due-today")  filtered=filtered.filter(t=>t.dueDate===todayStr);
  if (quickFilter==="due-week")   filtered=filtered.filter(t=>t.dueDate&&t.dueDate>=todayStr&&t.dueDate<=weekStr);
  if (quickFilter==="no-assignee")filtered=filtered.filter(t=>t.assignee==="Unassigned");

  const sortFns = {
    id:(a,b)=>a.id-b.id, title:(a,b)=>a.title.localeCompare(b.title),
    priority:(a,b)=>PRIORITIES.indexOf(a.priority)-PRIORITIES.indexOf(b.priority),
    status:(a,b)=>STATUSES.indexOf(a.status)-STATUSES.indexOf(b.status),
    dueDate:(a,b)=>(a.dueDate||"9999")>(b.dueDate||"9999")?1:-1,
  };
  filtered = [...filtered].sort((a,b)=>(sortDir==="asc"?1:-1)*(sortFns[sort]||sortFns.id)(a,b));

  const toggleSort = col => { if(sort===col)setSortDir(d=>d==="asc"?"desc":"asc"); else{setSort(col);setSortDir("asc");} };
  const SortIcon = ({col})=> sort===col ? <span className="text-slate-400">{sortDir==="asc"?"↑":"↓"}</span> : <span className="text-slate-700">↕</span>;

  return (
    <div className="fade-in flex flex-col h-full">
      <div className="flex items-center gap-3 px-5 py-2.5 border-b border-slate-800/60 bg-slate-900/50 flex-shrink-0 flex-wrap gap-y-2">
        <QuickFilters active={quickFilter} setActive={setQuickFilter} tasks={tasks} settings={settings}/>
        <div className="ml-auto flex items-center gap-2">
          <select value={filterCat} onChange={e=>setFilterCat(e.target.value)}
            className="bg-slate-800 border border-slate-700 text-slate-300 text-xs rounded-md px-2 py-1">
            {allCats.map(c=><option key={c}>{c}</option>)}
          </select>
          <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}
            className="bg-slate-800 border border-slate-700 text-slate-300 text-xs rounded-md px-2 py-1">
            <option>All</option>{STATUSES.map(s=><option key={s}>{s}</option>)}
          </select>
          <span className="text-slate-500 text-xs">{filtered.length} task{filtered.length!==1?"s":""}</span>
        </div>
      </div>
      <div className="flex items-center px-5 py-2 text-xs text-slate-500 uppercase tracking-wide border-b border-slate-800/60 flex-shrink-0">
        <span className="w-7">#</span>
        <button className="flex-1 flex items-center gap-1 text-left hover:text-slate-300" onClick={()=>toggleSort("title")}>Title <SortIcon col="title"/></button>
        <button className="w-28 flex items-center gap-1 hover:text-slate-300" onClick={()=>toggleSort("priority")}>Priority <SortIcon col="priority"/></button>
        <button className="w-24 flex items-center gap-1 hover:text-slate-300" onClick={()=>toggleSort("status")}>Status <SortIcon col="status"/></button>
        <span className="w-24 hidden md:block">Category</span>
        <span className="w-24 hidden md:block">Assignee</span>
        <button className="w-24 flex items-center gap-1 hover:text-slate-300" onClick={()=>toggleSort("dueDate")}>Due <SortIcon col="dueDate"/></button>
      </div>
      <div className="flex-1 overflow-y-auto">
        {filtered.length===0&&<div className="text-slate-500 text-sm text-center py-16">No tasks match the current filter.</div>}
        {filtered.map(t=>{
          const db=dueBadge(t.dueDate);
          return (
            <div key={t.id} onClick={()=>onSelect(t.id)}
              className={`task-row flex items-center px-5 py-2.5 cursor-pointer border-b border-slate-800/40 ${selectedId===t.id?"bg-slate-800/80":""}`}>
              <span className="w-7 text-slate-600 text-xs">{t.id}</span>
              <div className="flex-1 flex items-center gap-2 min-w-0 pr-3">
                <span className={`text-sm font-medium truncate ${t.status==="Done"?"text-slate-500 line-through":""}`}>{t.title}</span>
                {t.notes&&<span title="Has notes" className="text-slate-500 text-xs flex-shrink-0">📝</span>}
                {t.checklist.length>0&&<span className="text-slate-600 text-xs flex-shrink-0">{t.checklist.filter(c=>c.done).length}/{t.checklist.length}</span>}
              </div>
              <span className="w-28"><span className={`text-xs px-2 py-0.5 rounded-full font-medium ${pc(t.priority)}`}>{t.priority}</span></span>
              <span className="w-24"><span className={`text-xs px-2 py-0.5 rounded-full font-medium ${sc(t.status)}`}>{t.status}</span></span>
              <span className={`w-24 hidden md:block text-xs font-medium ${cc(t.category)}`}>{t.category}</span>
              <span className="w-24 hidden md:block text-slate-400 text-xs">{t.assignee}</span>
              <span className="w-24">
                {t.dueDate
                  ? <span className={`text-xs ${db?`px-1.5 py-0.5 rounded-full font-medium ${db}`:"text-slate-400"}`}>{fmtDate(t.dueDate)}</span>
                  : <span className="text-slate-600 text-xs">—</span>}
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Settings ───────────────────────────────────────────────────────────────
function Settings({ settings, onSave, tasks, onImportTasks, onResetTasks, onClearTasks, toast }) {
  const [draft,setDraft]     = useState({...settings});
  const [newAssignee,setNA]  = useState("");
  const [newCategory,setNC]  = useState("");
  const [saved,setSaved]     = useState(false);
  const [section,setSection] = useState("General");
  const [confirm,setConfirm] = useState(null);
  const fileRef=useRef();
  const upd=(k,v)=>setDraft(d=>({...d,[k]:v}));
  const addA=()=>{const v=newAssignee.trim();if(!v||draft.assignees.includes(v))return;upd("assignees",[...draft.assignees,v]);setNA("");};
  const addC=()=>{const v=newCategory.trim();if(!v||draft.categories.includes(v))return;upd("categories",[...draft.categories,v]);setNC("");};
  const save=()=>{onSave(draft);setSaved(true);toast("Settings saved","success");setTimeout(()=>setSaved(false),1500);};
  const doExport=()=>{
    const blob=new Blob([JSON.stringify({tasks,settings},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="opsboard-backup.json";a.click();
    toast("Backup exported","success");
  };
  const doImport=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.tasks)onImportTasks(d.tasks);if(d.settings)onSave(d.settings);toast("Import successful","success");}catch{toast("Invalid file format","error");}};
    reader.readAsText(file);e.target.value="";
  };
  const sections=["General","Team","Categories","Data","Keyboard Shortcuts"];
  return (
    <div className="fade-in flex h-full">
      <div className="w-48 border-r border-slate-800/60 p-4 flex-shrink-0 bg-slate-900/40">

            <div className="glass rounded-xl p-5">

                <div className="w-28">
                  <label className="text-xs text-slate-500 uppercase tracking-wide mb-1 block">Initials</label>
                  <input value={draft.initials} onChange={e=>upd("initials",e.target.value.toUpperCase().slice(0,3))} maxLength={3}
                    className="w-full bg-slate-800 border border-slate-700 text-white text-sm rounded-md px-3 py-2 focus:border-indigo-500 transition-colors text-center font-bold tracking-widest"/>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold text-white" style={{background:draft.accentColor+"cc"}}>{draft.initials||"?"}</div>
                <span className="text-slate-300 text-sm">{draft.userName||"Your name"}</span>
              </div>

        )}
        {section==="Team"&&(
          <div className="fade-in max-w-lg">
            <h2 className="text-white font-semibold text-lg mb-1">Team</h2>
            <p className="text-slate-400 text-sm mb-5">Manage assignees available on all tasks.</p>
            <div className="glass rounded-xl p-5">
              <div className="flex flex-col gap-2 mb-3">
                {draft.assignees.map(a=>(
                  <div key={a} className="flex items-center justify-between bg-slate-800/60 rounded-md px-3 py-2">
                    <div className="flex items-center gap-2">
                      <div className="w-6 h-6 rounded-full bg-slate-600 flex items-center justify-center text-xs text-white font-bold">{initials(a)}</div>
                      <span className="text-slate-200 text-sm">{a}</span>

              </div>
              <div className="flex gap-2">
                <input value={newAssignee} onChange={e=>setNA(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addA()}
                  placeholder="Add assignee…" className="flex-1 bg-slate-800 border border-slate-700 text-white text-sm rounded-md px-3 py-2 focus:border-indigo-500 transition-colors"/>
                <button onClick={addA} className="px-4 py-2 rounded-md text-white text-sm font-medium hover:opacity-90" style={{background:draft.accentColor}}>Add</button>

        {section==="Categories"&&(
          <div className="fade-in max-w-lg">
            <h2 className="text-white font-semibold text-lg mb-1">Categories</h2>
            <p className="text-slate-400 text-sm mb-5">Task categories for filters, detail panel, and dashboard.</p>
            <div className="glass rounded-xl p-5">
              <div className="flex flex-col gap-2 mb-3">
                {draft.categories.map(c=>(
                  <div key={c} className="flex items-center justify-between bg-slate-800/60 rounded-md px-3 py-2">
                    <span className={`text-sm font-medium ${cc(c)}`}>{c}</span>
                    <button onClick={()=>upd("categories",draft.categories.filter(x=>x!==c))} className="text-slate-600 hover:text-red-400 text-xs transition-colors">Remove</button>

              </div>
              <div className="flex gap-2">
                <input value={newCategory} onChange={e=>setNC(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addC()}
                  placeholder="New category…" className="flex-1 bg-slate-800 border border-slate-700 text-white text-sm rounded-md px-3 py-2 focus:border-indigo-500 transition-colors"/>
                <button onClick={addC} className="px-4 py-2 rounded-md text-white text-sm font-medium hover:opacity-90" style={{background:draft.accentColor}}>Add</button>
              </div>
            </div>
          </div>
        )}
        {section==="Data"&&(
          <div className="fade-in max-w-lg">
            <h2 className="text-white font-semibold text-lg mb-1">Data Management</h2>
            <p className="text-slate-400 text-sm mb-5">Export, import, or reset board data.</p>
            {[
              {title:"Export",desc:"Download all tasks and settings as a JSON backup.",btn:"Export Backup (JSON)",act:doExport,danger:false},
            ].map(item=>(
              <div key={item.title} className="glass rounded-xl p-5 mb-3">
                <h3 className="text-slate-300 text-sm font-medium mb-1">{item.title}</h3>
                <p className="text-slate-500 text-xs mb-3">{item.desc}</p>
                <button onClick={item.act} className="px-4 py-2 rounded-md text-white text-sm font-medium hover:opacity-90" style={{background:draft.accentColor}}>{item.btn}</button>

            ))}
            <div className="glass rounded-xl p-5 mb-3">
              <h3 className="text-slate-300 text-sm font-medium mb-1">Import</h3>
              <p className="text-slate-500 text-xs mb-3">Restore from a JSON backup. Overwrites current data.</p>
              <input ref={fileRef} type="file" accept=".json" onChange={doImport} className="hidden"/>
              <button onClick={()=>fileRef.current.click()} className="px-4 py-2 rounded-md text-slate-200 text-sm font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700">Import from JSON</button>

            <div className="glass rounded-xl p-5 mb-3">
              <h3 className="text-slate-300 text-sm font-medium mb-1">Clear All Tasks</h3>
              <p className="text-slate-500 text-xs mb-3">Permanently delete every task from the board. Cannot be undone.</p>
              <button onClick={()=>setConfirm({title:"Clear all tasks?",message:"Every task will be permanently deleted.",confirmLabel:"Clear All",onConfirm:()=>{onResetTasks();setConfirm(null);toast("All tasks cleared","warn");}})}
                className="px-4 py-2 rounded-md text-orange-300 text-sm font-medium bg-orange-950 hover:bg-orange-900 border border-orange-900">Clear Tasks</button>
            </div>
            <div className="glass rounded-xl p-5 mb-3">
              <h3 className="text-slate-300 text-sm font-medium mb-1">Clear All Tasks</h3>
              <p className="text-slate-500 text-xs mb-3">Permanently delete every task.</p>
              <button onClick={()=>setConfirm({title:"Clear all tasks?",message:"Every task deleted permanently.",confirmLabel:"Delete All",onConfirm:()=>{onClearTasks();setConfirm(null);toast("All tasks cleared","error");}})}
                className="px-4 py-2 rounded-md text-red-400 text-sm font-medium bg-red-950 hover:bg-red-900 border border-red-900">Clear All</button>
            </div>
            <div className="glass rounded-xl p-5">
              <h3 className="text-slate-300 text-sm font-medium mb-2">Storage</h3>
              <div className="flex gap-3 text-xs">
                <div className="bg-slate-800 rounded-lg px-3 py-2"><div className="text-white font-bold">{tasks.length}</div><div className="text-slate-400">Tasks</div></div>
                <div className="bg-slate-800 rounded-lg px-3 py-2"><div className="text-white font-bold">{(JSON.stringify({tasks,settings}).length/1024).toFixed(1)} KB</div><div className="text-slate-400">Size</div></div>
              </div>
            </div>
          </div>
        )}
        {section==="Keyboard Shortcuts"&&(
          <div className="fade-in max-w-lg">
            <h2 className="text-white font-semibold text-lg mb-1">Keyboard Shortcuts</h2>
            <p className="text-slate-400 text-sm mb-5">Speed up your workflow.</p>
            <div className="glass rounded-xl p-5">
              {[
                ["N","New task"],["/ or Ctrl+K","Open search"],["Esc","Close panel / dismiss"],
                ["S","Go to Settings"],["B","Go to Backlog"],["D","Go to Dashboard"],
                ["I","Go to Incidents"],["V","Go to Vulnerabilities"],
              ].map(([key,desc])=>(
                <div key={key} className="flex items-center justify-between py-2.5 border-b border-slate-800/60 last:border-0">

}

// ── Detail Panel ───────────────────────────────────────────────────────────
function DetailPanel({ task, onUpdate, onDelete, onClose, settings, toast }) {
  const [title,setTitle]         = useState(task.title);
  const [description,setDesc]    = useState(task.description);
  const [status,setStatus]       = useState(task.status);
  const [priority,setPriority]   = useState(task.priority);
  const [category,setCategory]   = useState(task.category);
  const [assignee,setAssignee]   = useState(task.assignee);
  const [dueDate,setDueDate]     = useState(task.dueDate);
  const [checklist,setChecklist] = useState(task.checklist);
  const [notes,setNotes]         = useState(task.notes||"");
  const [newCheck,setNewCheck]   = useState("");
  const [newTag,setNewTag]       = useState("");
  const [tags,setTags]           = useState(task.tags||[]);
  const [saved,setSaved]         = useState(false);
  const [tab,setTab]             = useState("detail");
  const [confirmDelete,setConfirmDelete] = useState(false);

  useEffect(()=>{
    setTitle(task.title);setDesc(task.description);setStatus(task.status);
    setPriority(task.priority);setCategory(task.category);setAssignee(task.assignee);
    setDueDate(task.dueDate);setChecklist(task.checklist);setNotes(task.notes||"");setTags(task.tags||[]);
  },[task.id]);

  const save=()=>{
    onUpdate({...task,title,description,status,priority,category,assignee,dueDate,checklist,notes,tags});
    setSaved(true);toast("Task saved","success");setTimeout(()=>setSaved(false),1500);
  };
  const toggleCheck=id=>setChecklist(cl=>cl.map(c=>c.id===id?{...c,done:!c.done}:c));
  const addCheck=()=>{if(!newCheck.trim())return;setChecklist(cl=>[...cl,{id:Date.now(),text:newCheck.trim(),done:false}]);setNewCheck("");};
  const removeCheck=id=>setChecklist(cl=>cl.filter(c=>c.id!==id));
  const addTag=()=>{const v=newTag.trim();if(!v||tags.includes(v))return;setTags(t=>[...t,v]);setNewTag("");};
  const removeTag=t=>setTags(ts=>ts.filter(x=>x!==t));
  const done=checklist.filter(c=>c.done).length;
  const db=dueBadge(dueDate);

  return (
    <div className="w-80 flex-shrink-0 border-l border-slate-800/60 flex flex-col slide-in" style={{background:"#0d1424"}}>
      {/* Header */}
      <div className="flex items-center justify-between px-4 py-2.5 border-b border-slate-800/60 flex-shrink-0">
        <div className="flex gap-1">
          {["detail","notes"].map(t=>(
            <button key={t} onClick={()=>setTab(t)}
              className={`text-xs px-2.5 py-1 rounded-md font-medium transition-colors capitalize ${tab===t?"text-white":"text-slate-500 hover:text-slate-300"}`}
              style={tab===t?{background:settings.accentColor+"33",color:settings.accentColor}:{}}>
              {t}{t==="notes"&&notes?"*":""}
            </button>
          ))}
        </div>
        <div className="flex items-center gap-1.5">
          <button onClick={()=>{navigator.clipboard?.writeText(`#${task.id} ${task.title}`);toast("Copied to clipboard","info");}}
            className="text-slate-600 hover:text-slate-400 text-xs px-1.5 py-0.5 rounded hover:bg-slate-800 transition-colors" title="Copy task ID">#{task.id}</button>
          <button onClick={onClose} className="text-slate-500 hover:text-slate-300 w-6 h-6 flex items-center justify-center rounded hover:bg-slate-800 transition-colors">✕</button>
        </div>
      </div>

      {tab==="detail"&&(
        <div className="flex-1 overflow-y-auto">
          {/* Title */}
          <div className="px-4 pt-3 pb-2">
            <input value={title} onChange={e=>setTitle(e.target.value)}
              className="w-full bg-transparent text-white text-sm font-semibold border-b border-slate-700 pb-1 focus:border-indigo-500 transition-colors"
              placeholder="Task title"/>
          </div>
          {/* Due date warning */}
          {db&&<div className={`mx-4 mb-2 text-xs px-2.5 py-1.5 rounded-md font-medium ${db}`}>
            {isOverdue(dueDate)?"Overdue — "+fmtDate(dueDate):"Due soon — "+fmtDate(dueDate)}
          </div>}
          {/* Description */}
          <div className="px-4 py-2">
            <label className="text-xs text-slate-500 uppercase tracking-wide mb-1 block">Description</label>
            <textarea value={description} onChange={e=>setDesc(e.target.value)} rows={4}
              className="w-full bg-slate-800/60 border border-slate-700/60 text-slate-300 text-xs rounded-lg p-2.5 resize-none focus:border-indigo-500 transition-colors"
              placeholder="Task description…"/>
          </div>
          {/* Checklist */}
          <div className="px-4 py-2">
            <div className="flex items-center justify-between mb-1">
              <label className="text-xs text-slate-500 uppercase tracking-wide">Checklist</label>
              {checklist.length>0&&<span className="text-xs text-slate-500">{done}/{checklist.length}</span>}
            </div>
            {checklist.length>0&&<div className="mb-2 bg-slate-800 rounded-full h-1"><div className="h-1 rounded-full transition-all" style={{width:`${(done/checklist.length)*100}%`,background:settings.accentColor}}/></div>}
            <div className="flex flex-col gap-1 mt-1">
              {checklist.map(c=>(
                <div key={c.id} className="flex items-center gap-2 group py-0.5">
                  <input type="checkbox" checked={c.done} onChange={()=>toggleCheck(c.id)} className="flex-shrink-0" style={{accentColor:settings.accentColor}}/>
                  <span className={`text-xs flex-1 ${c.done?"line-through text-slate-500":"text-slate-300"}`}>{c.text}</span>
                  <button onClick={()=>removeCheck(c.id)} className="opacity-0 group-hover:opacity-100 text-slate-600 hover:text-red-400 text-xs transition-all">✕</button>
                </div>
              ))}
            </div>
            <div className="flex gap-1 mt-2">
              <input value={newCheck} onChange={e=>setNewCheck(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addCheck()}
                className="flex-1 bg-slate-800/60 border border-slate-700/60 text-slate-300 text-xs rounded-lg px-2 py-1.5 focus:border-indigo-500 transition-colors"
                placeholder="Add item…"/>
              <button onClick={addCheck} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg transition-colors">+</button>
            </div>
          </div>
          {/* Tags */}
          <div className="px-4 py-2">
            <label className="text-xs text-slate-500 uppercase tracking-wide mb-1.5 block">Tags</label>
            <div className="flex flex-wrap gap-1 mb-1.5">
              {tags.map(tag=>(
                <span key={tag} className="flex items-center gap-1 text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full border border-slate-700 group cursor-pointer" onClick={()=>removeTag(tag)}>
                  {tag}<span className="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-red-400 transition-all">✕</span>
                </span>
              ))}
            </div>
            <div className="flex gap-1">
              <input value={newTag} onChange={e=>setNewTag(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTag()}
                className="flex-1 bg-slate-800/60 border border-slate-700/60 text-slate-300 text-xs rounded-lg px-2 py-1.5 focus:border-indigo-500 transition-colors"
                placeholder="Add tag…"/>
              <button onClick={addTag} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg transition-colors">+</button>
            </div>
          </div>
          {/* Divider */}
          <div className="border-t border-slate-800/60 mx-4 my-2"/>
          {/* Actions */}
          <div className="px-4 flex flex-col gap-2">
            <button onClick={save}
              className={`w-full py-2 rounded-lg text-sm font-semibold transition-colors ${saved?"bg-emerald-600 text-white":"text-white hover:opacity-90"}`}
              style={saved?{}:{background:settings.accentColor}}>
              {saved?"Saved ✓":"Save"}
            </button>
            {status!=="Done"&&(
              <button onClick={()=>{setStatus("Done");onUpdate({...task,title,description,status:"Done",priority,category,assignee,dueDate,checklist,notes,tags});toast("Task marked done","success");}}
                className="w-full py-2 rounded-lg text-sm font-medium bg-emerald-950 hover:bg-emerald-900 text-emerald-300 border border-emerald-800/60">
                Mark as Done ✓
              </button>
            )}
            <div className="grid grid-cols-2 gap-2">
              <button onClick={()=>setConfirmDelete(true)}
                className="py-2 rounded-lg text-xs font-medium bg-red-950/80 hover:bg-red-900 text-red-400 border border-red-900/60">Delete</button>
              <button onClick={onClose}
                className="py-2 rounded-lg text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-400 border border-slate-700/60">Close</button>
            </div>
          </div>
          <div className="border-t border-slate-800/60 mx-4 my-3"/>
          {/* Metadata */}
          <div className="px-4 flex flex-col gap-3 pb-5">
            {[
              {label:"Status",value:status,set:setStatus,opts:STATUSES},
              {label:"Priority",value:priority,set:setPriority,opts:PRIORITIES},
              {label:"Category",value:category,set:setCategory,opts:settings.categories},
              {label:"Assignee",value:assignee,set:setAssignee,opts:settings.assignees},
            ].map(({label,value,set,opts})=>(
              <div key={label}>
                <label className="text-xs text-slate-500 uppercase tracking-wide mb-1 block">{label}</label>
                <select value={value} onChange={e=>set(e.target.value)}
                  className="w-full bg-slate-800/60 border border-slate-700/60 text-slate-300 text-sm rounded-lg px-2 py-1.5 focus:border-indigo-500 transition-colors">
                  {opts.map(o=><option key={o}>{o}</option>)}
                </select>
              </div>
            ))}
            <div>
              <label className="text-xs text-slate-500 uppercase tracking-wide mb-1 block">Due Date</label>
              <input type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)}
                className="w-full bg-slate-800/60 border border-slate-700/60 text-slate-300 text-sm rounded-lg px-2 py-1.5 focus:border-indigo-500 transition-colors"/>
            </div>
            <div className="text-xs text-slate-700">Created {task.createdAt}</div>
          </div>
        </div>
      )}

      {tab==="notes"&&(
        <div className="flex-1 flex flex-col p-4">
          <label className="text-xs text-slate-500 uppercase tracking-wide mb-2">Notes</label>
          <textarea value={notes} onChange={e=>setNotes(e.target.value)}
            className="flex-1 bg-slate-800/40 border border-slate-700/60 text-slate-300 text-sm rounded-xl p-3 resize-none focus:border-indigo-500 transition-colors"
            placeholder="Free-form notes, post-mortem details, links…"/>
          <button onClick={save}
            className={`mt-3 py-2 rounded-lg text-sm font-semibold transition-colors ${saved?"bg-emerald-600 text-white":"text-white hover:opacity-90"}`}
            style={saved?{}:{background:settings.accentColor}}>
            {saved?"Saved ✓":"Save Notes"}
          </button>
        </div>
      )}

      {confirmDelete&&(
        <ConfirmModal title="Delete task?" message={`"${task.title}" will be permanently removed.`}
          confirmLabel="Delete" danger={true} accentColor={settings.accentColor}
          onConfirm={()=>{setConfirmDelete(false);onDelete(task.id);toast("Task deleted","error");}}
          onCancel={()=>setConfirmDelete(false)}/>
      )}
    </div>
  );
}

// ── New Task Modal ─────────────────────────────────────────────────────────
function NewTaskModal({ onAdd, onClose, settings, toast }) {
  const [title,setTitle]         = useState("");
  const [description,setDesc]    = useState("");
  const [status,setStatus]       = useState("Todo");
  const [priority,setPriority]   = useState("Medium");
  const [category,setCategory]   = useState(settings.categories[0]||"");
  const [assignee,setAssignee]   = useState(settings.assignees[0]||"");
  const [dueDate,setDueDate]     = useState("");

  const add=()=>{
    if(!title.trim())return;
    onAdd({title:title.trim(),description,status,priority,category,assignee,dueDate,tags:[],checklist:[],notes:""});
    toast("Task created","success");onClose();
  };
  return (
    <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 fade-in"
      onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="glass rounded-2xl w-full max-w-md p-6 shadow-2xl">
        <h3 className="text-white font-semibold mb-4">New Task</h3>
        <div className="flex flex-col gap-3">
          <input value={title} onChange={e=>setTitle(e.target.value)}
            className="w-full bg-slate-800 border border-slate-700 text-white text-sm rounded-xl px-3 py-2.5 focus:border-indigo-500 transition-colors"
            placeholder="Task title *" autoFocus/>
          <textarea value={description} onChange={e=>setDesc(e.target.value)} rows={3}
            className="w-full bg-slate-800 border border-slate-700 text-slate-300 text-sm rounded-xl px-3 py-2.5 resize-none focus:border-indigo-500 transition-colors"
            placeholder="Description (optional)"/>
          <div className="grid grid-cols-2 gap-3">
            {[
              {label:"Status",value:status,set:setStatus,opts:STATUSES},
              {label:"Priority",value:priority,set:setPriority,opts:PRIORITIES},
              {label:"Category",value:category,set:setCategory,opts:settings.categories},
              {label:"Assignee",value:assignee,set:setAssignee,opts:settings.assignees},
            ].map(({label,value,set,opts})=>(
              <div key={label}>
                <label className="text-xs text-slate-500 mb-1 block">{label}</label>
                <select value={value} onChange={e=>set(e.target.value)}
                  className="w-full bg-slate-800 border border-slate-700 text-slate-300 text-sm rounded-xl px-2 py-2 focus:border-indigo-500 transition-colors">
                  {opts.map(o=><option key={o}>{o}</option>)}
                </select>
              </div>
            ))}
          </div>
          <div>
            <label className="text-xs text-slate-500 mb-1 block">Due Date</label>
            <input type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)}
              className="w-full bg-slate-800 border border-slate-700 text-slate-300 text-sm rounded-xl px-2 py-2 focus:border-indigo-500 transition-colors"/>
          </div>
        </div>
        <div className="flex gap-3 mt-5">
          <button onClick={add} className="flex-1 py-2.5 rounded-xl text-white text-sm font-medium hover:opacity-90 transition-all" style={{background:settings.accentColor}}>Create Task</button>
          <button onClick={onClose} className="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium border border-slate-700">Cancel</button>
        </div>
      </div>
    </div>
  );
}

// ── Login Page ─────────────────────────────────────────────────────────────
function LoginPage({ onAuth, accentColor }) {
  // mode: "login" | "register" | "forgot" | "reset"
  const [mode,setMode]       = useState(() => {
    const p = new URLSearchParams(window.location.search);
    return p.get("reset") ? "reset" : "login";
  });
  const [resetToken]         = useState(() => new URLSearchParams(window.location.search).get("reset") || "");
  const [email,setEmail]     = useState("");
  const [password,setPass]   = useState("");
  const [confirmPass,setCP]  = useState("");
  const [name,setName]       = useState("");
  const [showPass,setShowP]  = useState(false);
  const [showCP,setShowCP]   = useState(false);
  const [error,setError]     = useState("");
  const [info,setInfo]       = useState("");
  const [loading,setLoad]    = useState(false);
  const [msalLoading,setML]  = useState(false);

  const switchMode = m => { setMode(m); setError(""); setInfo(""); setPass(""); setCP(""); };

  // ── Submit handler ───────────────────────────────────────────────────
  const submit = async () => {
    setError(""); setInfo("");

    if (mode==="reset") {
      if (!password) { setError("Enter a new password."); return; }
      if (password.length<8) { setError("Password must be at least 8 characters."); return; }
      if (password!==confirmPass) { setError("Passwords do not match."); return; }
      setLoad(true);
      try {
        await AuthService.resetPassword(resetToken, password);
        setInfo("Password updated. You can now sign in.");
        setPass(""); setCP("");
        // Strip the token from the URL so a refresh doesn't re-trigger reset mode
        window.history.replaceState({}, "", window.location.pathname);
        setTimeout(() => switchMode("login"), 2000);
      } catch(e) { setError(e.message); }
      finally { setLoad(false); }
      return;
    }

    if (mode==="forgot") {
      if (!email) { setError("Enter your email address."); return; }
      setLoad(true);
      try {
        await AuthService.forgotPassword(email);
        setInfo(`If an account exists for ${email}, a reset link has been sent.`);
        setEmail("");
      } catch(e) { setError(e.message); }
      finally { setLoad(false); }
      return;
    }

    if (!email||!password) { setError("Email and password are required."); return; }
    if (mode==="register"&&!name) { setError("Display name is required."); return; }
    if (mode==="register"&&password.length<8) { setError("Password must be at least 8 characters."); return; }
    setLoad(true);
    try {
      const user = mode==="login"
        ? await AuthService.login(email,password)
        : await AuthService.register(email,password,name);
      onAuth(user);
    } catch(e) { setError(e.message); }
    finally { setLoad(false); }
  };

  // ── Microsoft SSO ────────────────────────────────────────────────────
  const msalSignIn = async () => {
    setML(true); setError("");
    try {
      const user = await AuthService.msalLogin();
      onAuth(user);
    } catch(e) { setError(e.message); }
    finally { setML(false); }
  };

  // Password strength (register only)
  const strength = password.length===0?0:password.length<6?1:password.length<10?2:/[^a-zA-Z0-9]/.test(password)&&password.length>=10?4:3;
  const strengthLabel = ["","Weak","Fair","Good","Strong"][strength];
  const strengthColor = ["","#ef4444","#f97316","#eab308","#22c55e"][strength];

  const inputCls = "w-full bg-slate-800/80 border border-slate-700 text-white text-sm rounded-xl px-3 py-2.5 focus:border-indigo-500 transition-colors placeholder-slate-500";

  return (
    <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden" style={{background:"#0a0f1e"}}>
      {/* Background decoration */}
      <div style={{position:"fixed",inset:0,backgroundImage:"linear-gradient(rgba(99,102,241,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.03) 1px,transparent 1px)",backgroundSize:"48px 48px",pointerEvents:"none"}}/>
      <div style={{position:"fixed",top:"-20%",left:"50%",transform:"translateX(-50%)",width:"600px",height:"400px",background:"radial-gradient(ellipse,rgba(99,102,241,.1) 0%,transparent 70%)",pointerEvents:"none"}}/>

      <div className="w-full max-w-sm relative z-10 fade-in">
        {/* Logo */}
        <div className="flex flex-col items-center mb-8">
          <div className="w-14 h-14 rounded-2xl flex items-center justify-center mb-4"
            style={{background:`linear-gradient(135deg,${accentColor} 0%,#818cf8 100%)`,boxShadow:`0 0 0 1px rgba(99,102,241,.3),0 8px 32px rgba(99,102,241,.15)`}}>
            <svg width="28" height="28" viewBox="0 0 14 14" fill="none">
              <rect x="1" y="1" width="5" height="5" rx="1.2" fill="white" opacity="0.95"/>
              <rect x="8" y="1" width="5" height="5" rx="1.2" fill="white" opacity="0.6"/>
              <rect x="1" y="8" width="5" height="5" rx="1.2" fill="white" opacity="0.6"/>
              <rect x="8" y="8" width="5" height="5" rx="1.2" fill="white" opacity="0.95"/>
            </svg>
          </div>
          <h1 className="text-2xl font-bold text-white tracking-tight">Ops<span style={{color:accentColor}}>Board</span></h1>
          <p className="text-slate-500 text-sm mt-1">DevOps &amp; Security task management</p>
        </div>

        {/* Card */}
        <div className="rounded-2xl p-7" style={{background:"rgba(15,23,42,.8)",backdropFilter:"blur(16px)",border:"1px solid rgba(99,102,241,.18)",boxShadow:"0 8px 32px rgba(0,0,0,.4)"}}>

          {/* Mode toggle — login/register only */}
          {mode==="login" || mode==="register" ? (
            <div className="flex bg-slate-800/80 rounded-xl p-1 mb-6">
              {["login","register"].map(m=>(
                <button key={m} onClick={()=>switchMode(m)}
                  className="flex-1 py-1.5 rounded-lg text-sm font-medium transition-all"
                  style={mode===m?{background:accentColor,color:"#fff",boxShadow:`0 2px 8px ${accentColor}66`}:{color:"#64748b"}}>
                  {m==="login"?"Sign In":"Register"}
                </button>
              ))}
            </div>
          ) : (
            <button onClick={()=>switchMode("login")} className="flex items-center gap-1.5 text-slate-400 hover:text-slate-200 text-sm mb-5 transition-colors">
              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7"/></svg>
              Back to sign in
            </button>
          )}

          <h2 className="text-white font-semibold text-base mb-1">
            {mode==="login"?"Welcome back":mode==="register"?"Create your account":mode==="reset"?"Set a new password":"Reset your password"}
          </h2>
          <p className="text-slate-500 text-xs mb-5">
            {mode==="login"?"Sign in to your OpsBoard workspace.":mode==="register"?"Get started — it only takes a minute.":mode==="reset"?"Choose a strong password for your account.":"We'll send a reset link to your email."}
          </p>

          {/* Error / info banners */}
          {error && (
            <div className="flex items-start gap-2 bg-red-950/70 border border-red-800/60 text-red-300 text-xs rounded-xl px-3 py-2.5 mb-4">
              <span className="flex-shrink-0 mt-0.5">⚠</span><span>{error}</span>
            </div>
          )}
          {info && (
            <div className="flex items-start gap-2 bg-emerald-950/70 border border-emerald-800/60 text-emerald-300 text-xs rounded-xl px-3 py-2.5 mb-4">
              <span className="flex-shrink-0 mt-0.5">✓</span><span>{info}</span>
            </div>
          )}

          <div className="flex flex-col gap-4">
            {/* Reset mode — new password + confirm only */}
            {mode==="reset" ? (
              <>
                <div>
                  <label className="text-xs text-slate-400 uppercase tracking-widest mb-1.5 block font-medium">New Password</label>
                  <div className="relative">
                    <input type={showPass?"text":"password"} value={password} autoFocus
                      onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}
                      className={inputCls+" pl-9 pr-14"} placeholder="••••••••"/>
                    <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    <button type="button" onClick={()=>setShowP(p=>!p)}
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-xs transition-colors select-none">
                      {showPass?"Hide":"Show"}
                    </button>
                  </div>
                  {password.length>0 && (
                    <div className="mt-2 fade-in">
                      <div className="flex gap-1 mb-1">
                        {[1,2,3,4].map(i=>(
                          <div key={i} className="flex-1 h-1 rounded-full transition-all"
                            style={{background:strength>=i?strengthColor:"#1e293b"}}/>
                        ))}
                      </div>
                      <p className="text-xs" style={{color:strengthColor||"#64748b"}}>{strengthLabel}</p>
                    </div>
                  )}
                </div>
                <div>
                  <label className="text-xs text-slate-400 uppercase tracking-widest mb-1.5 block font-medium">Confirm Password</label>
                  <div className="relative">
                    <input type={showCP?"text":"password"} value={confirmPass}
                      onChange={e=>setCP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}
                      className={inputCls+" pl-9 pr-14"} placeholder="••••••••"/>
                    <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    <button type="button" onClick={()=>setShowCP(p=>!p)}
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-xs transition-colors select-none">
                      {showCP?"Hide":"Show"}
                    </button>
                  </div>
                  {confirmPass.length>0 && password!==confirmPass && (
                    <p className="text-red-400 text-xs mt-1">Passwords do not match.</p>

                </div>

            ) : (
              <>
                {/* Display name — register only */}

                  <div className="fade-in">
                    <label className="text-xs text-slate-400 uppercase tracking-widest mb-1.5 block font-medium">Display Name</label>
                    <input value={name} onChange={e=>setName(e.target.value)} autoFocus
                      className={inputCls} placeholder="Your name"/>
                  </div>
                )}

                {/* Email */}
                <div>
                  <label className="text-xs text-slate-400 uppercase tracking-widest mb-1.5 block font-medium">Email</label>
                  <div className="relative">
                    <input type="email" value={email} onChange={e=>setEmail(e.target.value)}

                    </svg>
                  </div>
                </div>

                {/* Password — not shown on forgot */}
                {mode!=="forgot" && (
                  <div>
                    <div className="flex items-center justify-between mb-1.5">
                      <label className="text-xs text-slate-400 uppercase tracking-widest font-medium">Password</label>
                      {mode==="login" && (
                        <button onClick={()=>switchMode("forgot")}
                          className="text-xs transition-colors hover:opacity-80" style={{color:accentColor}}>
                          Forgot password?
                        </button>
                      )}
                    </div>
                    <div className="relative">
                      <input type={showPass?"text":"password"} value={password}
                        onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}

                      <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                      </svg>
                      <button type="button" onClick={()=>setShowP(p=>!p)}
                        className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-xs transition-colors select-none">
                        {showPass?"Hide":"Show"}
                      </button>
                    </div>
                    {mode==="register" && password.length>0 && (
                      <div className="mt-2 fade-in">
                        <div className="flex gap-1 mb-1">
                          {[1,2,3,4].map(i=>(
                            <div key={i} className="flex-1 h-1 rounded-full transition-all"
                              style={{background:strength>=i?strengthColor:"#1e293b"}}/>

          {/* Primary submit button */}
          <button onClick={submit} disabled={loading}

            style={{background:`linear-gradient(135deg,${accentColor} 0%,#818cf8 100%)`,boxShadow:`0 4px 16px ${accentColor}55`}}>
            {loading?"Please wait…"

          </button>

          {/* Divider + Microsoft SSO — not shown on forgot or reset */}
          {mode!=="forgot" && mode!=="reset" && (
            <>
              <div className="flex items-center gap-3 my-4">
                <div className="flex-1 h-px bg-slate-800"/>
