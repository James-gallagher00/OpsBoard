              <button onClick={msalSignIn} disabled={msalLoading}
                className="w-full py-2.5 rounded-xl text-sm font-medium border transition-all flex items-center justify-center gap-2.5 disabled:opacity-50 hover:bg-slate-700/60"
                style={{background:"rgba(30,41,59,.8)",borderColor:"#334155",color:"#cbd5e1"}}>
                {msalLoading
                  ? <span className="text-xs text-slate-400">Opening sign-in…</span>
                  : <>
                      {/* Microsoft logo */}
                      <svg className="w-4 h-4 flex-shrink-0" viewBox="0 0 21 21" fill="none">
                        <rect x="1"  y="1"  width="9" height="9" fill="#f25022"/>
                        <rect x="11" y="1"  width="9" height="9" fill="#7fba00"/>
                        <rect x="1"  y="11" width="9" height="9" fill="#00a4ef"/>
                        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
                      </svg>
                      Sign in with work account
                    </>
                }
              </button>
            </>
          )}
        </div>

        {/* Footer */}
        <div className="flex items-center justify-center gap-3 mt-5">
          <span className="flex items-center gap-1.5 text-xs text-slate-600">
            <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"/>
            Secured
          </span>
          <span className="text-slate-700">·</span>
          <span className="text-xs text-slate-600">Data encrypted in transit</span>
        </div>
      </div>
    </div>
  );
}

// ── Storage Status Badge ───────────────────────────────────────────────────
function StorageBadge({ mode }) {
  const cfg = {
    azure:  { dot:"bg-emerald-500", label:"Synced",  title:"Data is being saved to the cloud" },
    local:  { dot:"bg-yellow-500",  label:"Offline", title:"Working offline — sign in to sync your data" },
    memory: { dot:"bg-red-500",     label:"Unsaved", title:"Data will be lost on refresh" },
  }[mode] || { dot:"bg-slate-500", label:"?", title:"Unknown storage mode" };
  return (
    <span title={cfg.title} className="hidden md:flex items-center gap-1.5 text-xs text-slate-500 bg-slate-800/60 border border-slate-700/50 px-2 py-1 rounded-full cursor-default">
      <span className={`w-1.5 h-1.5 rounded-full ${cfg.dot} ${mode==="azure"?"pulse-dot":""}`}/>
      {cfg.label}
    </span>
  );
}

// ── App ────────────────────────────────────────────────────────────────────
function App() {
  // auth states: "loading" | "unauthenticated" | "authenticated"
  const [authState,setAuthState]   = useState("loading");
  const [user,setUser]             = useState(null);
  const [tasks,setTasks]           = useState(SEED_TASKS);
  const [settings,setSettings]     = useState(DEFAULT_SETTINGS);
  const [dataLoaded,setDataLoaded] = useState(false);
  const [storageMode,setStorageMode] = useState("local");
  const [activeTab,setActiveTab]   = useState("Dashboard");
  const [selectedId,setSelectedId] = useState(null);
  const [showNew,setShowNew]       = useState(false);
  const [search,setSearch]         = useState("");
  const [showSearch,setShowSearch] = useState(false);
  const { toasts, toast, dismiss } = useToast();

  // ── Bootstrap ────────────────────────────────────────────────────────────
  useEffect(()=>{
    const init = async () => {
      if (!azureConfigured()) {
        // Azure not set up yet — skip auth, use localStorage directly
        const t = await StorageService.load("tasks", SEED_TASKS);
        const s = await StorageService.load("settings", DEFAULT_SETTINGS);
        setTasks(t); setSettings({...DEFAULT_SETTINGS,...s});
        setStorageMode(StorageService.mode());
        setUser({name:"Local Mode",email:"",id:"local"});
        setAuthState("authenticated"); setDataLoaded(true);
        return;
      }
      // Try to restore session from this tab
      const restored = AuthService.restoreSession();
      if (restored) {
        const t = await StorageService.load("tasks", SEED_TASKS);
        const s = await StorageService.load("settings", DEFAULT_SETTINGS);
        setTasks(t); setSettings({...DEFAULT_SETTINGS,...s});
        setStorageMode(StorageService.mode());
        setUser(restored); setAuthState("authenticated"); setDataLoaded(true);
      } else {
        setAuthState("unauthenticated");
      }
    };
    init();
  },[]);

  // ── Auto-save ────────────────────────────────────────────────────────────
  useEffect(()=>{
    if (!dataLoaded) return;
    StorageService.save("tasks",tasks).then(m=>{ if(m) setStorageMode(m); });
  },[tasks]);

  useEffect(()=>{
    if (!dataLoaded) return;
    StorageService.save("settings",settings);
    document.title = settings.appName||"OpsBoard";
  },[settings]);

  // ── Keyboard shortcuts ───────────────────────────────────────────────────
  useEffect(()=>{
    const h=e=>{
      const tag=document.activeElement?.tagName;
      if(["INPUT","TEXTAREA","SELECT"].includes(tag))return;
      if(e.key==="Escape"){setShowNew(false);setShowSearch(false);setSearch("");setSelectedId(null);return;}
      if(e.key==="n"||e.key==="N"){setShowNew(true);return;}
      if(e.key==="/"||((e.ctrlKey||e.metaKey)&&e.key==="k")){e.preventDefault();setShowSearch(true);return;}
      if(e.key==="b"||e.key==="B"){setActiveTab("Backlog");return;}
      if(e.key==="d"||e.key==="D"){setActiveTab("Dashboard");return;}
      if(e.key==="s"||e.key==="S"){setActiveTab("Settings");return;}
      if(e.key==="i"||e.key==="I"){setActiveTab("Incidents");return;}
      if(e.key==="v"||e.key==="V"){setActiveTab("Vulnerabilities");return;}
    };
    window.addEventListener("keydown",h);
    return()=>window.removeEventListener("keydown",h);
  },[]);

  // ── Auth handlers ────────────────────────────────────────────────────────
  const handleAuth = async u => {
    const t = await StorageService.load("tasks",SEED_TASKS);
    const s = await StorageService.load("settings",DEFAULT_SETTINGS);
    setTasks(t); setSettings({...DEFAULT_SETTINGS,...s});
    setStorageMode(StorageService.mode());
    setUser(u); setAuthState("authenticated"); setDataLoaded(true);
    toast(`Welcome back, ${u.name.split(" ")[0]}!`,"success");
  };
  const handleLogout = () => {
    AuthService.logout();
    setAuthState("unauthenticated"); setUser(null); setDataLoaded(false); setSelectedId(null);
  };

  // ── Task handlers ────────────────────────────────────────────────────────
  const select       = id=>setSelectedId(p=>p===id?null:id);
  const update       = u=>setTasks(ts=>ts.map(t=>t.id===u.id?u:t));
  const del          = id=>{setTasks(ts=>ts.filter(t=>t.id!==id));setSelectedId(null);};
  const add          = nt=>{const id=Math.max(...tasks.map(t=>t.id),0)+1;setTasks(ts=>[{...nt,id,createdAt:today()},...ts]);};
  const saveSettings = s=>setSettings({...DEFAULT_SETTINGS,...s});
  const switchTab    = t=>{setActiveTab(t);setSelectedId(null);if(showSearch){setShowSearch(false);setSearch("");}};

  const selectedTask = tasks.find(t=>t.id===selectedId)||null;

  // ── Render: loading ──────────────────────────────────────────────────────
  if (authState==="loading") return (
    <div className="min-h-screen flex items-center justify-center" style={{background:"#0a0f1e"}}>
      <div className="flex flex-col items-center gap-3">
        <div className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:DEFAULT_SETTINGS.accentColor}}>
          <svg width="20" height="20" viewBox="0 0 14 14" fill="none">
            <rect x="1" y="1" width="5" height="5" rx="1" fill="white" opacity="0.9"/>
            <rect x="8" y="1" width="5" height="5" rx="1" fill="white" opacity="0.6"/>
            <rect x="1" y="8" width="5" height="5" rx="1" fill="white" opacity="0.6"/>
            <rect x="8" y="8" width="5" height="5" rx="1" fill="white" opacity="0.9"/>
          </svg>
        </div>
        <div className="text-slate-500 text-sm">Loading…</div>
      </div>
    </div>
  );

  // ── Render: login ────────────────────────────────────────────────────────
  if (authState==="unauthenticated") return (
    <><LoginPage onAuth={handleAuth} accentColor={settings.accentColor}/><ToastContainer toasts={toasts} dismiss={dismiss}/></>
  );

  // ── Render: main app ─────────────────────────────────────────────────────
  return (
    <div className="flex flex-col h-screen overflow-hidden" style={{background:"#0a0f1e"}}>
      <TopNav activeTab={activeTab} setActiveTab={switchTab} onNew={()=>setShowNew(true)}
        settings={settings} tasks={tasks} search={search} setSearch={setSearch}
        showSearch={showSearch} setShowSearch={setShowSearch}
        storageMode={storageMode} user={user} onLogout={handleLogout}/>
      <div className="flex flex-1 overflow-hidden">
        <div className="flex-1 overflow-y-auto">
          {showSearch
            ? <SearchResults tasks={tasks} query={search} onSelect={id=>{select(id);setShowSearch(false);setSearch("");}} settings={settings}/>
            : <>
                {activeTab==="Dashboard"      && <Dashboard tasks={tasks} onSelect={select} settings={settings}/>}
                {activeTab==="Backlog"        && <Backlog tasks={tasks} onSelect={select} selectedId={selectedId} settings={settings} toast={toast}/>}
                {activeTab==="Board"          && <Board tasks={tasks} onSelect={select} settings={settings}/>}
                {activeTab==="Incidents"      && <Incidents tasks={tasks} onSelect={select} selectedId={selectedId}/>}
                {activeTab==="Vulnerabilities"&& <Vulnerabilities tasks={tasks} onSelect={select} selectedId={selectedId}/>}
                {activeTab==="Settings"       && <Settings settings={settings} onSave={saveSettings} tasks={tasks}
                  onImportTasks={t=>{setTasks(t);setSelectedId(null);}} onResetTasks={()=>{setTasks(SEED_TASKS);setSelectedId(null);}}
                  onClearTasks={()=>{setTasks([]);setSelectedId(null);}} toast={toast}/>}
              </>
          }
        </div>
        {selectedTask&&activeTab!=="Settings"&&(
          <DetailPanel task={selectedTask} onUpdate={update} onDelete={del}
            onClose={()=>setSelectedId(null)} settings={settings} toast={toast}/>
        )}
      </div>
      {showNew&&<NewTaskModal onAdd={add} onClose={()=>setShowNew(false)} settings={settings} toast={toast}/>}
      <ToastContainer toasts={toasts} dismiss={dismiss}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
