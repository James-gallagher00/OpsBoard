// ── Login Page ─────────────────────────────────────────────────────────────
function LoginPage({ onAuth, onLocalMode, accentColor }) {
  // mode: "login" | "register" | "forgot" | "reset" | "2fa"
  const [mode,setMode]       = useState(() => {
    const p = new URLSearchParams(window.location.search);
    return p.get("reset") ? "reset" : "login";
  });
  const [resetToken]         = useState(() => new URLSearchParams(window.location.search).get("reset") || "");
  const [email,setEmail]     = useState("");
  const [password,setPass]   = useState("");
  const [confirmPass,setCP]  = useState("");
  const [name,setName]       = useState("");
  const [twoFaCode,set2Fa]   = useState("");
  const [showPass,setShowP]  = useState(false);
  const [showCP,setShowCP]   = useState(false);
  const [error,setError]     = useState("");
  const [info,setInfo]       = useState("");
  const [loading,setLoad]    = useState(false);
  const [msalLoading,setML]  = useState(false);

  const switchMode = m => { setMode(m); setError(""); setInfo(""); setPass(""); setCP(""); set2Fa(""); };



  // ── Submit handler ───────────────────────────────────────────────────
  const submit = async () => {
    setError(""); setInfo("");

    if (mode==="2fa") {
      if (!twoFaCode.trim()) { setError("Enter the 6-digit code from your email."); return; }
      setLoad(true);
      try {
        const user = await AuthService.verify2fa(email, twoFaCode.trim());
        onAuth(user);
      } catch(e) { setError(e.message); }
      finally { setLoad(false); }
      return;
    }

    if (mode==="reset") {
      if (!password) { setError("Enter a new password."); return; }
      if (password.length<8) { setError("Password must be at least 8 characters."); return; }
      if (password!==confirmPass) { setError("Passwords do not match."); return; }
      setLoad(true);
      try {
        await AuthService.resetPassword(resetToken, password);
        setInfo("Password updated. You can now sign in.");
        setPass(""); setCP("");
        // Strip the token from the URL so a refresh doesn't re-trigger reset mode
        window.history.replaceState({}, "", window.location.pathname);
        setTimeout(() => switchMode("login"), 2000);
      } catch(e) { setError(e.message); }
      finally { setLoad(false); }
      return;
    }

    if (mode==="forgot") {
      if (!email) { setError("Enter your email address."); return; }
      setLoad(true);
      try {
        await AuthService.forgotPassword(email);
        setInfo(`If an account exists for ${email}, a reset link has been sent.`);
        setEmail("");
      } catch(e) { setError(e.message); }
      finally { setLoad(false); }
      return;
    }

    if (!email||!password) { setError("Email and password are required."); return; }
    if (mode==="register"&&!name) { setError("Display name is required."); return; }
    if (mode==="register"&&password.length<8) { setError("Password must be at least 8 characters."); return; }
    setLoad(true);
    try {
      if (mode==="login") {
        const result = await AuthService.login(email, password);
        if (result && result._2fa_required) {
          // Backend says 2FA required — send the code and show code entry screen
          await AuthService.send2fa(email);
          setInfo("A 6-digit code has been sent to your email.");
          switchMode("2fa");
        } else if (result && result.id) {
          onAuth(result);
        } else {
          // Unexpected response — don't grant access
          setError("Sign-in failed. Please try again.");
        }
      } else {
        const user = await AuthService.register(email, password, name);
        onAuth(user);
      }
    } catch(e) { setError(e.message); }
    finally { setLoad(false); }
  };

  // ── Microsoft SSO ────────────────────────────────────────────────────
  const msalSignIn = async () => {
    setML(true); setError("");
    try {
      if (typeof msal === "undefined") {
        throw new Error("Sign-in script failed to load. Try disabling browser tracking protection for this site, then refresh.");
      }
      const user = await AuthService.msalLogin();
      onAuth(user);
    } catch(e) { setError(e.message); }
    finally { setML(false); }
  };

  // Password strength (register only)
  const strength = password.length===0?0:password.length<6?1:password.length<10?2:/[^a-zA-Z0-9]/.test(password)&&password.length>=10?4:3;
  const strengthLabel = ["","Weak","Fair","Good","Strong"][strength];
  const strengthColor = ["","#ef4444","#f97316","#eab308","#22c55e"][strength];

  const inputCls = "w-full bg-slate-800/80 border border-slate-700 text-white text-sm rounded-xl px-3 py-2.5 focus:border-indigo-500 transition-colors placeholder-slate-500";

  return (
    <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden" style={{background:"var(--bg-base)"}}>
      {/* Background decoration */}
      <div style={{position:"fixed",inset:0,backgroundImage:"linear-gradient(rgba(99,102,241,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(99,102,241,.03) 1px,transparent 1px)",backgroundSize:"48px 48px",pointerEvents:"none"}}/>
      <div style={{position:"fixed",top:"-20%",left:"50%",transform:"translateX(-50%)",width:"600px",height:"400px",background:"radial-gradient(ellipse,rgba(99,102,241,.1) 0%,transparent 70%)",pointerEvents:"none"}}/>

      <div className="w-full max-w-sm relative z-10 fade-in">
        {/* Logo */}
        <div className="flex flex-col items-center mb-8">
          <div className="w-14 h-14 rounded-2xl flex items-center justify-center mb-4"
            style={{background:`linear-gradient(135deg,${accentColor} 0%,#818cf8 100%)`,boxShadow:`0 0 0 1px rgba(99,102,241,.3),0 8px 32px rgba(99,102,241,.15)`}}>
            <svg width="28" height="28" viewBox="0 0 14 14" fill="none">
              <rect x="1" y="1" width="5" height="5" rx="1.2" fill="white" opacity="0.95"/>
              <rect x="8" y="1" width="5" height="5" rx="1.2" fill="white" opacity="0.6"/>
              <rect x="1" y="8" width="5" height="5" rx="1.2" fill="white" opacity="0.6"/>
              <rect x="8" y="8" width="5" height="5" rx="1.2" fill="white" opacity="0.95"/>
            </svg>
          </div>
          <h1 className="text-2xl font-bold text-white tracking-tight">Ops<span style={{color:accentColor}}>Board</span></h1>
          <p className="text-slate-500 text-sm mt-1">DevOps &amp; Security task management</p>
        </div>

        {/* Card */}
        <div className="rounded-2xl p-7" style={{background:"rgba(15,23,42,.8)",backdropFilter:"blur(16px)",border:"1px solid rgba(99,102,241,.18)",boxShadow:"0 8px 32px rgba(0,0,0,.4)"}}>

          {/* Mode toggle — login/register only */}
          {mode==="login" || mode==="register" ? (
            <div className="flex bg-slate-800/80 rounded-xl p-1 mb-6">
              {["login","register"].map(m=>(
                <button key={m} onClick={()=>switchMode(m)}
                  className="flex-1 py-1.5 rounded-lg text-sm font-medium transition-all"
                  style={mode===m?{background:accentColor,color:"#fff",boxShadow:`0 2px 8px ${accentColor}66`}:{color:"#64748b"}}>
                  {m==="login"?"Sign In":"Register"}
                </button>
              ))}
            </div>
          ) : (
            <button onClick={()=>switchMode("login")} className="flex items-center gap-1.5 text-slate-400 hover:text-slate-200 text-sm mb-5 transition-colors">
              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7"/></svg>
              Back to sign in
            </button>
          )}

          <h2 className="text-white font-semibold text-base mb-1">
            {mode==="login"?"Welcome back":mode==="register"?"Create your account":mode==="reset"?"Set a new password":mode==="2fa"?"Check your email":"Reset your password"}
          </h2>
          <p className="text-slate-500 text-xs mb-5">
            {mode==="login"?"Sign in to your OpsBoard workspace.":mode==="register"?"Get started — it only takes a minute.":mode==="reset"?"Choose a strong password for your account.":mode==="2fa"?"Enter the 6-digit code we sent to your email address.":"We'll send a reset link to your email."}
          </p>

          {/* Error / info banners */}
          {error && (
            <div className="flex items-start gap-2 bg-red-950/70 border border-red-800/60 text-red-300 text-xs rounded-xl px-3 py-2.5 mb-4">
              <span className="flex-shrink-0 mt-0.5">⚠</span><span>{error}</span>
            </div>
          )}
          {info && (
            <div className="flex items-start gap-2 bg-emerald-950/70 border border-emerald-800/60 text-emerald-300 text-xs rounded-xl px-3 py-2.5 mb-4">
              <span className="flex-shrink-0 mt-0.5">✓</span><span>{info}</span>
            </div>
          )}

          <div className="flex flex-col gap-4">
            {/* 2FA mode — code entry only */}
            {mode==="2fa" ? (
              <div className="fade-in">
                <label className="text-xs text-slate-400 uppercase tracking-widest mb-1.5 block font-medium">Verification Code</label>
                <input
                  type="text"
                  inputMode="numeric"
                  pattern="[0-9]*"
                  maxLength={6}
                  value={twoFaCode}
                  onChange={e=>set2Fa(e.target.value.replace(/\D/g,"").slice(0,6))}
                  onKeyDown={e=>e.key==="Enter"&&submit()}
                  autoFocus
                  className={inputCls+" text-center text-2xl font-bold tracking-[0.5em]"}
                  placeholder="000000"
                />
                <p className="text-xs text-slate-500 mt-2 text-center">Didn't receive it?{" "}
                  <button type="button" onClick={async()=>{
                    try { await AuthService.send2fa(email); setInfo("Code resent."); }
                    catch(e) { setError(e.message); }
                  }} className="underline hover:opacity-80 transition-opacity" style={{color:accentColor}}>
                    Resend
                  </button>
                </p>
              </div>
            ) : mode==="reset" ? (
              <>
                <div>
                  <label className="text-xs text-slate-400 uppercase tracking-widest mb-1.5 block font-medium">New Password</label>
                  <div className="relative">
                    <input type={showPass?"text":"password"} value={password} autoFocus
                      onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}
                      className={inputCls+" pl-9 pr-14"} placeholder="••••••••"/>
                    <svg className="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                    <button type="button" onClick={()=>setShowP(p=>!p)}
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-xs transition-colors select-none">
                      {showPass?"Hide":"Show"}
                    </button>

                  {password.length>0 && (
                    <div className="mt-2 fade-in">

                  <div>

          </span>
          <span className="text-slate-700">·</span>
          <span className="text-xs text-slate-600">Data encrypted in transit</span>
        </div>
      </div>
    </div>
  );
}

// ── Storage Status Badge ───────────────────────────────────────────────────
function StorageBadge({ mode }) {
  const cfg = {
    azure:  { dot:"bg-emerald-500", label:"Synced",  title:"Data is being saved to the cloud" },
    local:  { dot:"bg-yellow-500",  label:"Offline", title:"Working offline — sign in to sync your data" },
    memory: { dot:"bg-red-500",     label:"Unsaved", title:"Data will be lost on refresh" },
  }[mode] || { dot:"bg-slate-500", label:"?", title:"Unknown storage mode" };
  return (
    <span title={cfg.title} className="hidden md:flex items-center gap-1.5 text-xs text-slate-500 bg-slate-800/60 border border-slate-700/50 px-2 py-1 rounded-full cursor-default">
      <span className={`w-1.5 h-1.5 rounded-full ${cfg.dot} ${mode==="azure"?"pulse-dot":""}`}/>
      {cfg.label}
    </span>
  );
}

// ── Time Tracker ───────────────────────────────────────────────────────────
function TimeTracker({ task, onUpdate, settings }) {
  const [entries, setEntries]   = useState(task.timeEntries||[]);
  const [running, setRunning]   = useState(false);
  const [startTs, setStartTs]   = useState(null);
  const [elapsed, setElapsed]   = useState(0);
  const [manualH, setManualH]   = useState("");
  const [manualM, setManualM]   = useState("");
  const [manualNote, setMNote]  = useState("");
  const intervalRef = useRef();

  useEffect(()=>{
    setEntries(task.timeEntries||[]);
    setRunning(false); setStartTs(null); setElapsed(0);
    clearInterval(intervalRef.current);
  },[task.id]);

  useEffect(()=>{
    if(running){
      intervalRef.current = setInterval(()=>setElapsed(Math.floor((Date.now()-startTs)/1000)),1000);
    } else {
      clearInterval(intervalRef.current);
    }
    return ()=>clearInterval(intervalRef.current);
  },[running]);

  const fmtSecs = s => {
    const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
    return h>0?`${h}h ${m}m`:`${m}m ${sec}s`;
  };
  const fmtEntry = mins => {
    const h=Math.floor(mins/60), m=mins%60;
    return h>0?`${h}h ${m>0?m+"m":""}`:m+"m";
  };

  const totalMins = entries.reduce((s,e)=>s+e.minutes,0);

  const startTimer = () => { setStartTs(Date.now()); setElapsed(0); setRunning(true); };
  const stopTimer  = () => {
    setRunning(false);
    const mins = Math.max(1, Math.round(elapsed/60));
    const newEntry = { id:Date.now(), minutes:mins, note:"Timer", date:today() };
    const updated = [...entries, newEntry];
    setEntries(updated);
    onUpdate({...task, timeEntries:updated});
    setElapsed(0);
  };

  const addManual = () => {
    const h=parseInt(manualH)||0, m=parseInt(manualM)||0;
    const total=h*60+m;
    if(total<=0) return;
    const newEntry = { id:Date.now(), minutes:total, note:manualNote.trim()||"Manual entry", date:today() };
    const updated = [...entries, newEntry];
    setEntries(updated); onUpdate({...task,timeEntries:updated});
    setManualH(""); setManualM(""); setMNote("");
  };

  const removeEntry = id => {
    const updated = entries.filter(e=>e.id!==id);
    setEntries(updated); onUpdate({...task,timeEntries:updated});
  };

  return (
    <div className="flex-1 overflow-y-auto p-4">
      {/* Total */}
      <div className="rounded-xl p-4 mb-4 flex items-center justify-between"
        style={{background:`rgba(99,102,241,0.08)`,border:"1px solid rgba(99,102,241,0.15)"}}>
        <div>
          <div className="text-xs mb-0.5" style={{color:"var(--text-faint)"}}>Total logged</div>
          <div className="text-2xl font-bold" style={{color:"var(--text)"}}>{fmtEntry(totalMins)||"0m"}</div>
        </div>
        <div className="text-xs" style={{color:"var(--text-faint)"}}>{entries.length} entr{entries.length===1?"y":"ies"}</div>
      </div>

      {/* Live timer */}
      <div className="glass rounded-xl p-4 mb-4">
        <div className="text-xs uppercase tracking-wide mb-3" style={{color:"var(--text-faint)"}}>Live timer</div>
        {running&&(
          <div className="text-2xl font-bold text-center mb-3 font-mono" style={{color:settings.accentColor}}>
            {fmtSecs(elapsed)}
          </div>
        )}
        <button
          onClick={running?stopTimer:startTimer}
          className="w-full py-2 rounded-lg text-sm font-semibold text-white transition-all hover:opacity-90"
          style={{background:running?"#ef4444":settings.accentColor}}>
          {running?"Stop & Save":"Start Timer"}
        </button>
      </div>

      {/* Manual entry */}
      <div className="glass rounded-xl p-4 mb-4">
        <div className="text-xs uppercase tracking-wide mb-3" style={{color:"var(--text-faint)"}}>Log time manually</div>
        <div className="flex gap-2 mb-2">
          <div className="flex-1">
            <label className="text-xs mb-1 block" style={{color:"var(--text-faint)"}}>Hours</label>
            <input type="number" min="0" max="24" value={manualH} onChange={e=>setManualH(e.target.value)}
              className="w-full rounded-lg px-2 py-1.5 text-sm text-center border focus:outline-none focus:border-indigo-500"
              style={{background:"var(--bg-input-solid)",borderColor:"var(--border)",color:"var(--text)"}}
              placeholder="0"/>
          </div>
          <div className="flex-1">
            <label className="text-xs mb-1 block" style={{color:"var(--text-faint)"}}>Minutes</label>
            <input type="number" min="0" max="59" value={manualM} onChange={e=>setManualM(e.target.value)}
              className="w-full rounded-lg px-2 py-1.5 text-sm text-center border focus:outline-none focus:border-indigo-500"
              style={{background:"var(--bg-input-solid)",borderColor:"var(--border)",color:"var(--text)"}}
              placeholder="30"/>
          </div>
        </div>
        <input value={manualNote} onChange={e=>setMNote(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addManual()}
          className="w-full rounded-lg px-2 py-1.5 text-xs border mb-2 focus:outline-none focus:border-indigo-500"
          style={{background:"var(--bg-input-solid)",borderColor:"var(--border)",color:"var(--text)"}}
          placeholder="Note (optional)"/>
        <button onClick={addManual}
          className="w-full py-2 rounded-lg text-sm font-medium text-white hover:opacity-90 transition-all"
          style={{background:settings.accentColor}}>Add Entry</button>
      </div>

      {/* Log */}
      {entries.length>0&&(
        <div className="glass rounded-xl p-4">
          <div className="text-xs uppercase tracking-wide mb-3" style={{color:"var(--text-faint)"}}>Log</div>
          <div className="flex flex-col gap-2">
            {[...entries].reverse().map(e=>(
              <div key={e.id} className="flex items-center justify-between group">
                <div>
                  <span className="text-sm font-medium" style={{color:"var(--text)"}}>{fmtEntry(e.minutes)}</span>
                  <span className="text-xs ml-2" style={{color:"var(--text-faint)"}}>{e.note}</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-xs" style={{color:"var(--text-faint)"}}>{e.date}</span>
                  <button onClick={()=>removeEntry(e.id)}
                    className="opacity-0 group-hover:opacity-100 text-xs transition-all hover:text-red-400"
                    style={{color:"var(--text-faint)"}}>✕</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}


// ── OpsBoard Assistant ─────────────────────────────────────────────────────
function ChatBot({ tasks, settings, onAdd, onUpdate, onSwitchTab, onSelect, toast, user }) {
  const [open, setOpen]         = useState(false);
  const [messages, setMessages] = useState([]);
  const [input, setInput]       = useState("");
  const [loading, setLoading]   = useState(false);
  const bottomRef = useRef();
  const inputRef  = useRef();

  useEffect(()=>{ if(open) setTimeout(()=>inputRef.current?.focus(),100); },[open]);
  useEffect(()=>{ bottomRef.current?.scrollIntoView({behavior:"smooth"}); },[messages]);

  // Greeting on first open
  useEffect(()=>{
    if(open && messages.length===0){
      setMessages([{role:"assistant",content:`Hi${user?.name?" "+user.name.split(" ")[0]:""}! I'm your OpsBoard assistant. I can create tasks, update them, log time, navigate to views, or answer questions about your board. What do you need?`}]);
    }
  },[open]);

  const systemPrompt = ()=>`You are OpsBoard Assistant, an AI built into OpsBoard — a DevOps and security task management app.

Today's date: ${new Date().toISOString().split("T")[0]}
Current user: ${user?.name||"Unknown"} (${user?.email||""})
Total tasks: ${tasks.length}
Open tasks: ${tasks.filter(t=>t.status!=="Done").length}
Overdue tasks: ${tasks.filter(t=>t.status!=="Done"&&t.dueDate&&t.dueDate<new Date().toISOString().split("T")[0]).length}

Available statuses: ${["Todo","In Progress","Review","Blocked","Done"].join(", ")}
Available priorities: ${["Critical","High","Medium","Low"].join(", ")}
Available categories: ${settings.categories.join(", ")}
Available assignees: ${settings.assignees.join(", ")}

Current tasks (JSON):
${JSON.stringify(tasks.map(t=>({id:t.id,title:t.title,status:t.status,priority:t.priority,category:t.category,assignee:t.assignee,dueDate:t.dueDate,timeEntries:t.timeEntries||[]})),null,2)}

You can perform actions by including a JSON block in your response. ALWAYS wrap action JSON in a markdown code block with the language tag "action".
Available actions:

1. Create a task:
\`\`\`action
{"type":"create_task","title":"...","description":"...","priority":"High","category":"Security","assignee":"Unassigned","status":"Todo","dueDate":"2026-04-20","tags":[],"checklist":[],"notes":""}
\`\`\`

2. Update a task (only include fields you want to change):
\`\`\`action
{"type":"update_task","id":3,"status":"Done"}
\`\`\`

3. Log time on a task:
\`\`\`action
{"type":"log_time","id":3,"minutes":90,"note":"Investigation and patch"}
\`\`\`

4. Navigate to a tab:
\`\`\`action
{"type":"navigate","tab":"Dashboard"}
\`\`\`
Available tabs: Dashboard, Backlog, Board, Incidents, Vulnerabilities, Settings

5. Open a task in the detail panel:
\`\`\`action
{"type":"open_task","id":3}
\`\`\`

You can include multiple action blocks in one response. Always confirm what you did in natural language after the action blocks.
Be concise. If asked for a summary, provide it clearly. If asked to do something impossible, explain why.`;

  const executeAction = (action) => {
    try {
      const a = JSON.parse(action);
      switch(a.type) {
        case "create_task": {
          const id = Math.max(...tasks.map(t=>t.id), 0) + 1;
          onAdd({
            title:       a.title||"New task",
            description: a.description||"",
            status:      a.status||"Todo",
            priority:    a.priority||"Medium",
            category:    a.category||settings.categories[0]||"Security",
            assignee:    a.assignee||settings.assignees[0]||"Unassigned",
            dueDate:     a.dueDate||"",
            tags:        a.tags||[],
            checklist:   a.checklist||[],
            notes:       a.notes||"",
            timeEntries: [],
          });
          return `Created task: "${a.title}"`;
        }
        case "update_task": {
          const t = tasks.find(x=>x.id===a.id);
          if(!t) return `Task #${a.id} not found.`;
          const updated = {...t};
          if(a.title)    updated.title    = a.title;
          if(a.status)   updated.status   = a.status;
          if(a.priority) updated.priority = a.priority;
          if(a.category) updated.category = a.category;
          if(a.assignee) updated.assignee = a.assignee;
          if(a.dueDate!==undefined) updated.dueDate = a.dueDate;
          if(a.notes!==undefined)   updated.notes   = a.notes;
          onUpdate(updated);
          return `Updated task #${a.id}: "${t.title}"`;
        }
        case "log_time": {
          const t = tasks.find(x=>x.id===a.id);
          if(!t) return `Task #${a.id} not found.`;
          const entry = {id:Date.now(),minutes:a.minutes||0,note:a.note||"Logged via assistant",date:new Date().toISOString().split("T")[0]};
          onUpdate({...t,timeEntries:[...(t.timeEntries||[]),entry]});
          const h=Math.floor(a.minutes/60),m=a.minutes%60;
          return `Logged ${h>0?h+"h ":""}${m>0?m+"m":""} on "${t.title}"`;
        }
        case "navigate": {
          onSwitchTab(a.tab);
          return `Navigated to ${a.tab}`;
        }
        case "open_task": {
          const t = tasks.find(x=>x.id===a.id);
          if(!t) return `Task #${a.id} not found.`;
          onSelect(a.id);
          return `Opened task: "${t.title}"`;
        }
        default:
          return `Unknown action: ${a.type}`;
      }
    } catch(e) {
      return `Action error: ${e.message}`;
    }
  };

  const send = async () => {
    const text = input.trim();
    if(!text || loading) return;
    setInput("");

    const userMsg = {role:"user", content:text};
    const newMessages = [...messages, userMsg];
    setMessages(newMessages);
    setLoading(true);

    try {
      const res = await fetch(`${AZURE.functionsUrl}/chat`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          system: systemPrompt(),
          messages: newMessages.map(m=>({role:m.role,content:m.content})),
        }),
      });

      if (!res.ok) {
        const errData = await res.json().catch(()=>({}));
        throw new Error(errData.error || `API error ${res.status}`);
      }

      const data = await res.json();
      const rawText = data.content?.[0]?.text || "Sorry, I didn't get a response.";

      // Extract and execute action blocks
      const actionRegex = /```action\s*([\s\S]*?)```/g;
      let match;
      const actionResults = [];
      while((match=actionRegex.exec(rawText))!==null){
        const result = executeAction(match[1].trim());
        actionResults.push(result);
      }

      // Strip action blocks from displayed text
      const displayText = rawText.replace(/```action[\s\S]*?```/g,"").trim();

      // Show toast for each action
      actionResults.forEach(r=>toast(r,"success"));

      setMessages(m=>[...m,{role:"assistant",content:displayText, actions:actionResults}]);
    } catch(e) {
      setMessages(m=>[...m,{role:"assistant",content:"Sorry, I ran into an error. Please try again."}]);
    } finally {
      setLoading(false);
    }
  };

  const suggestions = [
    "What tasks are overdue?",
    "Create a critical security task",
    "Summarise my board",
    "Show me the Dashboard",
  ];

  return (
    <>
      {/* Floating button */}
      <button
        onClick={()=>setOpen(o=>!o)}
        className="fixed bottom-5 right-5 w-12 h-12 rounded-full shadow-lg flex items-center justify-center z-40 transition-all hover:scale-110 active:scale-95"
        style={{background:`linear-gradient(135deg,${settings.accentColor},#818cf8)`,boxShadow:`0 4px 20px ${settings.accentColor}66`}}
        title="OpsBoard Assistant">
        {open
          ? <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12"/></svg>
          : <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
        }
        {tasks.filter(t=>t.status!=="Done"&&t.dueDate&&t.dueDate<new Date().toISOString().split("T")[0]).length>0&&!open&&(
          <span className="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full text-white text-[9px] font-bold flex items-center justify-center">
            {tasks.filter(t=>t.status!=="Done"&&t.dueDate&&t.dueDate<new Date().toISOString().split("T")[0]).length}
          </span>
        )}
      </button>

      {/* Chat panel */}
      {open&&(
        <div className="fixed bottom-20 right-5 w-80 sm:w-96 rounded-2xl shadow-2xl z-40 flex flex-col fade-in overflow-hidden"
          style={{height:"480px",background:"var(--bg-panel)",border:"1px solid rgba(99,102,241,0.2)",boxShadow:"0 16px 48px rgba(0,0,0,0.5)"}}>

          {/* Header */}
          <div className="flex items-center gap-3 px-4 py-3 flex-shrink-0 border-b" style={{borderColor:"var(--border-subtle)"}}>
            <div className="w-7 h-7 rounded-full flex items-center justify-center flex-shrink-0"
              style={{background:`linear-gradient(135deg,${settings.accentColor},#818cf8)`}}>
              <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
              </svg>
            </div>
            <div className="flex-1 min-w-0">
              <div className="text-sm font-semibold" style={{color:"var(--text)"}}>OpsBoard Assistant</div>
              <div className="text-xs" style={{color:"var(--text-faint)"}}>
                {loading?"Thinking…":`${tasks.length} tasks · ${tasks.filter(t=>t.status!=="Done").length} open`}
              </div>
            </div>
          </div>

          {/* Messages */}
          <div className="flex-1 overflow-y-auto px-4 py-3 flex flex-col gap-3">
            {messages.map((m,i)=>(
              <div key={i} className={`flex ${m.role==="user"?"justify-end":"justify-start"}`}>
                <div className={`max-w-[85%] rounded-2xl px-3 py-2 text-sm leading-relaxed ${
                  m.role==="user"
                    ?"text-white rounded-br-sm"
                    :"rounded-bl-sm"
                  }`}
                  style={m.role==="user"
                    ?{background:settings.accentColor}
                    :{background:"var(--bg-input-solid)",color:"var(--text-muted)",border:"1px solid var(--border)"}}>
                  <div style={{whiteSpace:"pre-wrap"}}>{m.content}</div>
                  {m.actions?.length>0&&(
                    <div className="mt-2 pt-2 border-t border-white/10 flex flex-col gap-1">
                      {m.actions.map((a,ai)=>(
                        <div key={ai} className="text-xs opacity-70 flex items-center gap-1">
                          <span>✓</span><span>{a}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            ))}
            {loading&&(
              <div className="flex justify-start">
                <div className="rounded-2xl rounded-bl-sm px-3 py-2.5 flex gap-1"
                  style={{background:"var(--bg-input-solid)",border:"1px solid var(--border)"}}>
                  {[0,1,2].map(i=>(
                    <span key={i} className="w-1.5 h-1.5 rounded-full animate-bounce"
                      style={{background:settings.accentColor,animationDelay:`${i*0.15}s`}}/>
                  ))}
                </div>
              </div>
            )}
            <div ref={bottomRef}/>
          </div>

          {/* Suggestions — shown when no messages except greeting */}
          {messages.length<=1&&(
            <div className="px-4 pb-2 flex flex-wrap gap-1.5 flex-shrink-0">
              {suggestions.map(s=>(
                <button key={s} onClick={()=>{setInput(s);setTimeout(()=>inputRef.current?.focus(),50);}}
                  className="text-xs px-2.5 py-1 rounded-full border transition-colors hover:border-indigo-500/50"
                  style={{borderColor:"var(--border)",color:"var(--text-muted)",background:"var(--bg-input-solid)"}}>
                  {s}
                </button>
              ))}
            </div>
          )}

          {/* Input */}
          <div className="flex items-center gap-2 px-3 py-3 flex-shrink-0 border-t" style={{borderColor:"var(--border-subtle)"}}>
            <input
              ref={inputRef}
              value={input}
              onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()}
              placeholder="Ask me anything…"
              className="flex-1 rounded-xl px-3 py-2 text-sm border focus:outline-none focus:border-indigo-500 transition-colors"
              style={{background:"var(--bg-input-solid)",borderColor:"var(--border)",color:"var(--text)"}}
              disabled={loading}
            />
            <button onClick={send} disabled={loading||!input.trim()}
              className="w-8 h-8 rounded-xl flex items-center justify-center flex-shrink-0 transition-all disabled:opacity-40"
              style={{background:settings.accentColor}}>
              <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
              </svg>
            </button>
          </div>
        </div>
      )}
    </>
  );
}

// ── App ────────────────────────────────────────────────────────────────────
function App() {
  // auth states: "loading" | "unauthenticated" | "authenticated"
  const [authState,setAuthState]   = useState("loading");
  const [user,setUser]             = useState(null);
  const [tasks,setTasks]           = useState(SEED_TASKS);
  const [settings,setSettings]     = useState(DEFAULT_SETTINGS);
  const [dataLoaded,setDataLoaded] = useState(false);
  const [storageMode,setStorageMode] = useState("local");
  const [activeTab,setActiveTab]   = useState("Dashboard");
  const [selectedId,setSelectedId] = useState(null);
  const [showNew,setShowNew]       = useState(false);
  const [search,setSearch]         = useState("");
  const [showSearch,setShowSearch] = useState(false);
  const { toasts, toast, dismiss } = useToast();
  const [showTutorial, setShowTutorial] = useState(false);
  const [confirmDialog, setConfirmDialog] = useState(null);
  const [showWhatsNew, setShowWhatsNew] = useState(false);

  // Apply theme class to document root
  useEffect(()=>{
    document.documentElement.classList.toggle("theme-light", settings.theme==="light");
  }, [settings.theme]);

  // ── Bootstrap ────────────────────────────────────────────────────────────
  useEffect(()=>{
    const init = async () => {
      // Fetch config from server before anything else — populates AZURE object
      await loadConfig();
      if (!azureConfigured()) {
        // Azure not set up yet — skip auth, use localStorage directly
        const t = await StorageService.load("tasks", SEED_TASKS);
        const s = await StorageService.load("settings", DEFAULT_SETTINGS);
        setTasks(t); setSettings({...DEFAULT_SETTINGS,...s});
        setStorageMode(StorageService.mode());
        setUser({name:"Local Mode",email:"",id:"local"});
        setAuthState("authenticated"); setDataLoaded(true);
        return;
      }
      // Try to restore session from this tab
      const restored = AuthService.restoreSession();
      if (restored) {
        const t = await StorageService.load("tasks", SEED_TASKS);
        const s = await StorageService.load("settings", DEFAULT_SETTINGS);
        setTasks(t); setSettings({...DEFAULT_SETTINGS,...s});
        setStorageMode(StorageService.mode());
        setUser(restored); setAuthState("authenticated"); setDataLoaded(true);
      } else {
        setAuthState("unauthenticated");
      }
    };
    init();
  },[]);

  // ── Auto-save ────────────────────────────────────────────────────────────
  useEffect(()=>{
    if (!dataLoaded) return;
    StorageService.save("tasks",tasks).then(m=>{ if(m) setStorageMode(m); });
  },[tasks]);

  useEffect(()=>{
    if (!dataLoaded) return;
    StorageService.save("settings",settings);
    document.title = settings.appName||"OpsBoard";
  },[settings]);

  // ── Keyboard shortcuts ───────────────────────────────────────────────────
  useEffect(()=>{
    const h=e=>{
      const tag=document.activeElement?.tagName;
      if(["INPUT","TEXTAREA","SELECT"].includes(tag))return;
      if(e.key==="Escape"){setShowNew(false);setShowSearch(false);setSearch("");setSelectedId(null);return;}
      if(e.key==="n"||e.key==="N"){setShowNew(true);return;}
      if(e.key==="/"||((e.ctrlKey||e.metaKey)&&e.key==="k")){e.preventDefault();setShowSearch(true);return;}
      if(e.key==="b"||e.key==="B"){setActiveTab("Backlog");return;}
      if(e.key==="d"||e.key==="D"){setActiveTab("Dashboard");return;}
      if(e.key==="s"||e.key==="S"){setActiveTab("Settings");return;}
      if(e.key==="i"||e.key==="I"){setActiveTab("Incidents");return;}
      if(e.key==="v"||e.key==="V"){setActiveTab("Vulnerabilities");return;}
    };
    window.addEventListener("keydown",h);
    return()=>window.removeEventListener("keydown",h);
  },[]);

  // ── Auth handlers ────────────────────────────────────────────────────────
  const handleAuth = async u => {
    const t = await StorageService.load("tasks",SEED_TASKS);
    const s = await StorageService.load("settings",DEFAULT_SETTINGS);
    const mergedSettings = {...DEFAULT_SETTINGS,...s};
    setTasks(t); setSettings(mergedSettings);
    setStorageMode(StorageService.mode());
    setUser(u); setAuthState("authenticated"); setDataLoaded(true);
    // Show tutorial on first login — detected by empty task list and no userName configured
    if (t.length===0 && !mergedSettings.userName) {
      setShowTutorial(true);
    } else {
      // Show What's New if this version hasn't been seen
      const seenVersion = localStorage.getItem("opsboard_seen_version");
      if (seenVersion !== APP_VERSION) {
        setShowWhatsNew(true);
      } else {
        toast(`Welcome back, ${u.name.split(" ")[0]}!`,"success");
      }
    }
  };
  const handleLocalMode = async () => {
    StorageService.init("local", null);
    const t = await StorageService.load("tasks", SEED_TASKS);
    const s = await StorageService.load("settings", DEFAULT_SETTINGS);
    const mergedSettings = {...DEFAULT_SETTINGS,...s};
    setTasks(t); setSettings(mergedSettings);
    setStorageMode("local");
    setUser({name:"Local User", email:"", id:"local"});
    setAuthState("authenticated"); setDataLoaded(true);
    if (t.length===0 && !mergedSettings.userName) {
      setShowTutorial(true);
    } else {
      toast("Running in local mode — data saved to this browser only","info");
    }
  };

  const handleLogout = () => {
    AuthService.logout();
    setAuthState("unauthenticated"); setUser(null); setDataLoaded(false); setSelectedId(null);
  };

  // ── Task handlers ────────────────────────────────────────────────────────
  const select       = id=>setSelectedId(p=>p===id?null:id);
  const update       = u=>setTasks(ts=>ts.map(t=>t.id===u.id?u:t));
  const del          = id=>{setTasks(ts=>ts.filter(t=>t.id!==id));setSelectedId(null);};
  const add          = nt=>{const id=Math.max(...tasks.map(t=>t.id),0)+1;setTasks(ts=>[{...nt,id,createdAt:today()},...ts]);};
  const saveSettings = s=>setSettings({...DEFAULT_SETTINGS,...s});
  const switchTab    = t=>{setActiveTab(t);setSelectedId(null);if(showSearch){setShowSearch(false);setSearch("");}};

  const selectedTask = tasks.find(t=>t.id===selectedId)||null;

  // ── Render: loading ──────────────────────────────────────────────────────
  if (authState==="loading") return (
    <div className="min-h-screen flex items-center justify-center" style={{background:"var(--bg-base)"}}>
      <div className="flex flex-col items-center gap-3">
        <div className="w-9 h-9 rounded-xl flex items-center justify-center" style={{background:DEFAULT_SETTINGS.accentColor}}>
          <svg width="20" height="20" viewBox="0 0 14 14" fill="none">
            <rect x="1" y="1" width="5" height="5" rx="1" fill="white" opacity="0.9"/>
            <rect x="8" y="1" width="5" height="5" rx="1" fill="white" opacity="0.6"/>
            <rect x="1" y="8" width="5" height="5" rx="1" fill="white" opacity="0.6"/>
            <rect x="8" y="8" width="5" height="5" rx="1" fill="white" opacity="0.9"/>
          </svg>
        </div>
        <div className="text-slate-500 text-sm">Loading…</div>
      </div>
    </div>
  );

  // ── Render: login ────────────────────────────────────────────────────────
  if (authState==="unauthenticated") return (
    <><LoginPage onAuth={handleAuth} onLocalMode={handleLocalMode} accentColor={settings.accentColor}/><ToastContainer toasts={toasts} dismiss={dismiss}/></>
  );

  // ── Render: main app ─────────────────────────────────────────────────────
  return (
    <div className="flex flex-col h-screen overflow-hidden" style={{background:"var(--bg-base)"}}>
      <TopNav activeTab={activeTab} setActiveTab={switchTab} onNew={()=>setShowNew(true)}
        settings={settings} tasks={tasks} search={search} setSearch={setSearch}
        showSearch={showSearch} setShowSearch={setShowSearch}
        storageMode={storageMode} user={user} onLogout={handleLogout}
        isDark={settings.theme!=="light"}
        onToggleTheme={()=>saveSettings({...settings,theme:settings.theme==="light"?"dark":"light"})}
        onSettings={()=>switchTab("Settings")}
        onDeleteData={()=>setConfirmDialog({
          title:"Clear all data?",
          message:"This will permanently delete all your tasks and reset your settings. This cannot be undone.",
          confirmLabel:"Clear everything",
          danger:true,
          onConfirm:()=>{ setTasks([]); saveSettings(DEFAULT_SETTINGS); setConfirmDialog(null); toast("All data cleared","warn"); }
        })}
        onDeleteAccount={()=>setConfirmDialog({
          title:"Delete account?",
          message:"Your account and all associated data will be permanently deleted. You will be signed out immediately. This cannot be undone.",
          confirmLabel:"Delete my account",
          danger:true,
          onConfirm:()=>{ handleLogout(); toast("Account deleted","error"); setConfirmDialog(null); }
        })}
      />
      <div className="flex flex-1 overflow-hidden">
        <div className="flex-1 overflow-y-auto">
          {showSearch
            ? <SearchResults tasks={tasks} query={search} onSelect={id=>{select(id);setShowSearch(false);setSearch("");}} settings={settings}/>
            : <>
                {activeTab==="Dashboard"      && <Dashboard tasks={tasks} onSelect={select} settings={settings}/>}
                {activeTab==="Backlog"        && <Backlog tasks={tasks} onSelect={select} selectedId={selectedId} settings={settings} toast={toast}/>}
                {activeTab==="Board"          && <Board tasks={tasks} onSelect={select} settings={settings}/>}
                {activeTab==="Incidents"      && <Incidents tasks={tasks} onSelect={select} selectedId={selectedId}/>}
                {activeTab==="Vulnerabilities"&& <Vulnerabilities tasks={tasks} onSelect={select} selectedId={selectedId}/>}
                {activeTab==="Settings"       && <Settings settings={settings} onSave={saveSettings} tasks={tasks}
                  onImportTasks={t=>{setTasks(t);setSelectedId(null);}} onResetTasks={()=>{setTasks(SEED_TASKS);setSelectedId(null);}}
                  onClearTasks={()=>{setTasks([]);setSelectedId(null);}} toast={toast}/>}
              </>
          }
        </div>
        {selectedTask&&activeTab!=="Settings"&&(
          <DetailPanel task={selectedTask} onUpdate={update} onDelete={del}
            onClose={()=>setSelectedId(null)} settings={settings} toast={toast}/>
        )}
      </div>
      {showNew&&<NewTaskModal onAdd={add} onClose={()=>setShowNew(false)} settings={settings} toast={toast}/>}
      {showTutorial&&<Tutorial onComplete={()=>{setShowTutorial(false);toast(`Welcome to OpsBoard!`,"success");}} accentColor={settings.accentColor} userName={user?.name}/>}
      {showWhatsNew&&<WhatsNew accentColor={settings.accentColor} onClose={()=>{localStorage.setItem("opsboard_seen_version",APP_VERSION);setShowWhatsNew(false);toast("You're on v1.1.0","success");}}/>}
      {confirmDialog&&<ConfirmModal title={confirmDialog.title} message={confirmDialog.message} confirmLabel={confirmDialog.confirmLabel} danger={confirmDialog.danger} onConfirm={confirmDialog.onConfirm} onCancel={()=>setConfirmDialog(null)} accentColor={settings.accentColor}/>}
      <ChatBot tasks={tasks} settings={settings} onAdd={add} onUpdate={update} onSwitchTab={switchTab} onSelect={select} toast={toast} user={user}/>
      <ToastContainer toasts={toasts} dismiss={dismiss}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
