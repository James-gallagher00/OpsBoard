<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Constants ──────────────────────────────────────────────────────────────
const STATUSES   = ["Todo","In Progress","Review","Blocked","Done"];
const PRIORITIES = ["Critical","High","Medium","Low"];
const CAT_COLORS = {
  Vulnerability:"text-red-400",Deployment:"text-blue-400",Security:"text-purple-400",
  Incident:"text-orange-400",Compliance:"text-yellow-400",Infrastructure:"text-cyan-400",
  Monitoring:"text-emerald-400",Patch:"text-pink-400"
};
const DEFAULT_SETTINGS = {
  appName:"OpsBoard", domain:"", userName:"", initials:"",
  assignees:["Unassigned"],
  categories:["Vulnerability","Deployment","Security","Incident","Compliance","Infrastructure","Monitoring","Patch"],
  accentColor:"#6366f1",
  theme:"dark",  // "dark" | "light"
  twoFaEnabled:true,
  // Task defaults
  defaultPriority:"Medium",
  defaultCategory:"Security",
  defaultAssignee:"Unassigned",
  // SLA thresholds (days)
  slaCritical:1,
  slaHigh:3,
  slaMedium:7,
  slaLow:14,
  // Notifications
  notifyOverdue:true,
  notifyDueSoon:true,
  dueSoonDays:3,
  // Display
  compactMode:false,
  showCompletedTasks:true,
  dateFormat:"dd/MM/yyyy",
};
const APP_VERSION = "1.1.0"; // bump this to trigger What's New on next login
const SEED_TASKS = [];

// ══════════════════════════════════════════════════════════════════════════
// ██  AZURE CONFIGURATION  — fill in your values here
// ══════════════════════════════════════════════════════════════════════════
// ── Runtime config ────────────────────────────────────────────────────────
// Fallback values keep the app working if /api/config isn't deployed yet.
// Once config.js is deployed, AAD IDs and storage values are served from
// environment variables instead of being hardcoded here.
const FUNCTIONS_BASE = "https://opsboardlogic.azurewebsites.net/api";

const AZURE = {
  functionsUrl:     FUNCTIONS_BASE,
  storageAccount:   "opsboardstorage",
  storageContainer: "opsboard-data",
  clientId:         null,
  tenantId:         null,
};

let _configLoaded = false;
let _configLoading = null;

const loadConfig = () => {
  if (_configLoaded) return Promise.resolve();
  if (_configLoading) return _configLoading;
  _configLoading = fetch(`${FUNCTIONS_BASE}/config`)
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(cfg => {
      if (cfg.functionsUrl)     AZURE.functionsUrl     = cfg.functionsUrl;
      if (cfg.storageAccount)   AZURE.storageAccount   = cfg.storageAccount;
      if (cfg.storageContainer) AZURE.storageContainer = cfg.storageContainer;
      if (cfg.clientId)         AZURE.clientId         = cfg.clientId;
      if (cfg.tenantId)         AZURE.tenantId         = cfg.tenantId;
      _configLoaded = true;
    })
    .catch(() => {
      // config.js not deployed yet — fallback values already set above, carry on
      _configLoaded = true;
    });
  return _configLoading;
};

const azureConfigured = () =>
  !!AZURE.functionsUrl && !!AZURE.storageAccount;
const msalConfigured = () => {
  if (typeof msal === "undefined") return false;
  return !!AZURE.clientId && !!AZURE.tenantId;
};

// MSAL instance — created lazily on first Microsoft sign-in attempt
let _msalInstance = null;
let _msalInitialised = false;
const getMsal = () => {
  if (_msalInstance) return _msalInstance;
  if (!msalConfigured()) return null;
  // Use origin only — path causes redirect_uri_mismatch if App Registration
  // has the root URL registered (which is the standard setup)
  const redirectUri = window.location.origin + '/';
  _msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId: AZURE.clientId,
      authority: `https://login.microsoftonline.com/${AZURE.tenantId}`,
      redirectUri,
      navigateToLoginRequestUrl: false,
    },
    cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true },
    system: {
      loggerOptions: {
        loggerCallback: (level, message, containsPii) => {
          if (!containsPii) console.log('[MSAL]', message);
        },
        logLevel: msal.LogLevel?.Warning ?? 2,
      },
    },
  });
  return _msalInstance;
};

const initialiseMsal = async () => {
  const instance = getMsal();
  if (!instance) return null;
  if (!_msalInitialised) {
    await instance.initialize();
    _msalInitialised = true;
    // Handle any redirect response (in case popup was blocked and fell back)
    await instance.handleRedirectPromise().catch(() => {});
  }
  return instance;
};
// ══════════════════════════════════════════════════════════════════════════

// ── Storage Service ────────────────────────────────────────────────────────
// Writes/reads JSON blobs to Azure Blob Storage using a per-user SAS token.
// Falls back to localStorage automatically if Azure is unreachable or not configured.
const StorageService = {
  _sasToken: null,
  _userId:   null,
  _mode:     "local", // "azure" | "local" | "memory"

  init(userId, sasToken) {
    this._userId   = userId;
    this._sasToken = sasToken;
    this._mode     = (userId && sasToken && azureConfigured()) ? "azure" : "local";
  },

  _url(key) {
    // Blob path: {container}/{userId}/{key}.json?{sasToken}
    return `https://${AZURE.storageAccount}.blob.core.windows.net/${AZURE.storageContainer}/${this._userId}/${key}.json?${this._sasToken}`;
  },

  async save(key, data) {
    if (this._mode === "azure") {
      try {
        const res = await fetch(this._url(key), {
          method: "PUT",
          headers: { "x-ms-blob-type": "BlockBlob", "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (res.ok) return "azure";
        if (res.status === 403) {
          // SAS token expired — clear session so user is prompted to re-login
          localStorage.removeItem("opsboard_session");
          this._mode = "local";
          console.warn("Session expired — please sign in again.");
        } else {
          throw new Error(res.statusText);
        }
      } catch (e) {
        console.warn("Cloud save failed, using local fallback:", e.message);
        this._mode = "local";
      }
    }
    try { localStorage.setItem(`opsboard_${key}`, JSON.stringify(data)); return "local"; }
    catch { return "memory"; }
  },

  async load(key, defaultVal) {
    if (this._mode === "azure") {
      try {
        const res = await fetch(this._url(key));
        if (res.ok) return await res.json();
        if (res.status === 403) {
          // SAS token expired — clear session so user is prompted to re-login
          localStorage.removeItem("opsboard_session");
          this._mode = "local";
          console.warn("Session expired — please sign in again.");
        } else if (res.status !== 404) {
          throw new Error(res.statusText);
        }
        return defaultVal; // 404 = no data yet, that's fine
      } catch (e) {
        console.warn("Cloud load failed, using local fallback:", e.message);
        this._mode = "local";
      }
    }
    try { const s = localStorage.getItem(`opsboard_${key}`); return s ? JSON.parse(s) : defaultVal; }
    catch { return defaultVal; }
  },

  mode() { return this._mode; },
};

// ── Auth Service ───────────────────────────────────────────────────────────
// Calls your Azure Functions for login/register.
// ▶ Your Function at /auth/login  must accept:  POST { email, password }
// ▶ Your Function at /auth/register must accept: POST { email, password, displayName }
// ▶ Both must return: { token, userId, displayName, sasToken }
//   where sasToken is a SAS query string for the user's blob directory.
const AuthService = {
  _token: null,
  _user:  null,

  // Extracts a human-friendly message from an API error response.
  // API returns { error: "..." }, fallback to status-based messages.
  async _parseError(res) {
    const statusMessages = {
      400: "Please check your details and try again.",
      401: "Incorrect email or password.",
      403: "You don't have permission to do that.",
      404: "Account not found.",
      409: "An account with this email already exists.",
      429: "Too many attempts. Please wait a moment and try again.",
      500: "Something went wrong on our end. Please try again shortly.",
    };
    try {
      const body = await res.json();
      return body.error || body.message || statusMessages[res.status] || "Something went wrong. Please try again.";
    } catch {
      return statusMessages[res.status] || "Something went wrong. Please try again.";
    }
  },

  async login(email, password) {
    const res = await fetch(`${AZURE.functionsUrl}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    if (!res.ok) throw new Error(await this._parseError(res));
    const data = await res.json();
    // Backend signals 2FA is required — don't apply session yet
    if (data.two_fa_required) return { _2fa_required: true };
    return this._apply(data, email);
  },

  async register(email, password, displayName) {
    const res = await fetch(`${AZURE.functionsUrl}/auth/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password, name: displayName }),
    });
    if (!res.ok) throw new Error(await this._parseError(res));
    const data = await res.json();
    // Always returns the same neutral message regardless of whether
    // the email was new or already registered — throw it as a signal
    // for the frontend to show as info and redirect to sign in
    throw new Error(data.message || "Check your inbox to complete registration.");
  },

  // ── Microsoft SSO ──────────────────────────────────────────────────────
  async msalLogin() {
    const msalInst = await initialiseMsal();
    if (!msalInst) throw new Error("Work account sign-in is not available.");

    let result;
    try {
      result = await msalInst.loginPopup({
        scopes: ["openid", "profile", "email"],
        prompt: "select_account",
      });
    } catch (err) {
      // BrowserAuthError: popup_window_error means the popup was blocked
      if (err?.errorCode === "popup_window_error" || err?.name === "BrowserAuthError") {
        throw new Error("Sign-in popup was blocked. Please allow popups for this site and try again.");
      }
      // User cancelled
      if (err?.errorCode === "user_cancelled") {
        throw new Error("Sign-in was cancelled.");
      }
      throw new Error(err?.message || "Work account sign-in failed. Please try again.");
    }

    if (!result?.idToken) throw new Error("No identity token received from sign-in.");

    const res = await fetch(`${AZURE.functionsUrl}/auth/microsoft`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ idToken: result.idToken }),
    });
    if (!res.ok) throw new Error(await this._parseError(res));
    return this._apply(await res.json(), result.account.username);
  },

  // ── 2FA ────────────────────────────────────────────────────────────────
  async send2fa(email) {
    const res = await fetch(`${AZURE.functionsUrl}/auth/send-2fa`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    if (!res.ok) throw new Error(await this._parseError(res));
    return true;
  },

  async updateProfile({ twoFaEnabled }) {
    const token = this._token;
    if (!token) {
      console.warn("updateProfile: no token available");
      return;
    }
    try {
      const res = await fetch(`${AZURE.functionsUrl}/auth/update-profile`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ twoFaEnabled }),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        console.error("updateProfile failed:", res.status, err);
      } else {
        console.log("updateProfile: 2FA set to", twoFaEnabled);
      }
    } catch(e) {
      console.error("updateProfile error:", e.message);
    }
  },

  async verify2fa(email, code) {
    const res = await fetch(`${AZURE.functionsUrl}/auth/verify-2fa`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, code }),
    });
    if (!res.ok) throw new Error(await this._parseError(res));
    return this._apply(await res.json(), email);
  },

  // ── Forgot password ────────────────────────────────────────────────────
  async forgotPassword(email) {
    const res = await fetch(`${AZURE.functionsUrl}/auth/forgot-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email }),
    });
    if (!res.ok) throw new Error(await this._parseError(res));
    return true;
  },

  // ── Reset password ──────────────────────────────────────────────────────
  async resetPassword(token, newPassword) {
    const res = await fetch(`${AZURE.functionsUrl}/auth/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, newPassword }),
    });
    if (!res.ok) throw new Error(await this._parseError(res));
    return true;
  },

  _apply(data, email) {
    this._token = data.token;
    const u     = data.user || {};
    this._user  = { id: u.id || data.userId, name: u.name || data.displayName, email };
    StorageService.init(this._user.id, data.sasToken);
    localStorage.setItem("opsboard_session", JSON.stringify({ token: data.token, user: this._user, sasToken: data.sasToken }));
    return this._user;
  },

  restoreSession() {
    try {
      const raw = localStorage.getItem("opsboard_session");
      if (!raw) return null;
      const { token, user, sasToken } = JSON.parse(raw);
      this._token = token; this._user = user;
      StorageService.init(user.id, sasToken);
      return user;
    } catch { return null; }
  },

  logout() {
    this._token = null; this._user = null;
    StorageService.init(null, null);
    localStorage.removeItem("opsboard_session");
  },

  get user() { return this._user; },
};

// ── Helpers ────────────────────────────────────────────────────────────────
const pc = p => p==="Critical"?"badge-critical":p==="High"?"badge-high":p==="Medium"?"badge-medium":"badge-low";
const sc = s => s==="Todo"?"status-todo":s==="In Progress"?"status-inprogress":s==="Review"?"status-review":s==="Blocked"?"status-blocked":"status-done";
const cc = c => CAT_COLORS[c]||"text-slate-400";
const today = () => new Date().toISOString().slice(0,10);
const isOverdue  = d => d && d < today() ? true : false;
const isDueSoon  = d => { if (!d) return false; const diff=(new Date(d)-new Date())/86400000; return diff>=0&&diff<=3; };
const dueBadge   = d => isOverdue(d) ? "overdue" : isDueSoon(d) ? "due-soon" : "";
const initials   = n => n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
const fmtDate    = d => { if (!d) return "—"; const dt=new Date(d+"T00:00:00"); return dt.toLocaleDateString("en-GB",{day:"numeric",month:"short"}); };

// ── Toast System ───────────────────────────────────────────────────────────
function ToastContainer({ toasts, dismiss }) {
  return ReactDOM.createPortal(
    <div className="fixed bottom-4 right-4 flex flex-col gap-2 z-50">
      {toasts.map(t => (
        <div key={t.id} onClick={()=>dismiss(t.id)}
          className={`toast-slide flex items-center gap-3 px-4 py-3 rounded-lg shadow-xl cursor-pointer border text-sm font-medium
            ${t.type==="success"?"bg-emerald-950 border-emerald-800 text-emerald-300":
              t.type==="error"?"bg-red-950 border-red-800 text-red-300":
              t.type==="warn"?"bg-orange-950 border-orange-800 text-orange-300":
              "bg-slate-800 border-slate-700 text-slate-200"}`}>
          <span>{t.type==="success"?"✓":t.type==="error"?"✕":t.type==="warn"?"⚠":"ℹ"}</span>
          <span>{t.message}</span>
        </div>
      ))}
    </div>,
    document.body
  );
}
function useToast() {
  const [toasts, setToasts] = useState([]);
  const toast = useCallback((message, type="info") => {
    const id = Date.now()+Math.random();
    setToasts(ts=>[...ts,{id,message,type}]);
    setTimeout(()=>setToasts(ts=>ts.filter(t=>t.id!==id)),3000);
  },[]);
  const dismiss = useCallback(id=>setToasts(ts=>ts.filter(t=>t.id!==id)),[]);
  return { toasts, toast, dismiss };
}

// ── Confirm Modal ──────────────────────────────────────────────────────────
function ConfirmModal({ title, message, confirmLabel="Confirm", danger=false, onConfirm, onCancel, accentColor }) {
  return ReactDOM.createPortal(
    <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 fade-in"
      onClick={e=>e.target===e.currentTarget&&onCancel()}>
      <div className="glass rounded-xl w-full max-w-sm p-6 shadow-2xl">
        <h3 className="text-white font-semibold text-base mb-2">{title}</h3>
        <p className="text-slate-400 text-sm mb-6">{message}</p>
        <div className="flex gap-3">
          <button onClick={onCancel} className="flex-1 py-2 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium border border-slate-700">Cancel</button>
          <button onClick={onConfirm}
            className={`flex-1 py-2 rounded-md text-sm font-semibold ${danger?"bg-red-700 hover:bg-red-600 text-white":"text-white hover:opacity-90"}`}
            style={danger?{}:{background:accentColor}}>{confirmLabel}</button>
        </div>
      </div>
    </div>, document.body
  );
}

// ── Search Bar ─────────────────────────────────────────────────────────────
function SearchBar({ value, onChange, onClose }) {
  const ref = useRef();
  useEffect(()=>{ ref.current?.focus(); },[]);
  return (
    <div className="flex items-center gap-2 bg-slate-800 border border-indigo-500/50 rounded-lg px-3 py-1.5 w-72">
      <svg className="w-3.5 h-3.5 text-slate-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input ref={ref} type="search" value={value} onChange={e=>onChange(e.target.value)}
        className="bg-transparent text-white text-sm flex-1 placeholder-slate-500"
        placeholder="Search tasks… (Esc to close)"/>
      {value && <button onClick={()=>onChange("")} className="text-slate-500 hover:text-slate-300 text-xs">✕</button>}
    </div>
  );
}

// ── TopNav ─────────────────────────────────────────────────────────────────
function TopNav({ activeTab, setActiveTab, onNew, settings, tasks, search, setSearch, showSearch, setShowSearch, storageMode, user, onLogout, onSettings, onDeleteData, onDeleteAccount, onToggleTheme, isDark }) {
  const tabs = ["Dashboard","Backlog","Board","Incidents","Vulnerabilities"];
  const [profileOpen, setProfileOpen] = useState(false);
  const profileRef = useRef();

  // Close dropdown on outside click
  useEffect(() => {
    const handler = e => { if (profileRef.current && !profileRef.current.contains(e.target)) setProfileOpen(false); };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  // Derive initials from user display name, fall back to settings.initials
  const nameInitials = (() => {
    const src = user?.name || settings.userName || "";
    const parts = src.trim().split(/\s+/).filter(Boolean);
    if (parts.length >= 2) return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
    if (parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return settings.initials || "?";
  })();

  const displayName = user?.name || settings.userName || "Account";
  const displayEmail = user?.email || "";

  const badgeCount = tab => {
    if (tab==="Incidents") return tasks.filter(t=>t.category==="Incident"&&t.status!=="Done").length;
    if (tab==="Vulnerabilities") return tasks.filter(t=>t.category==="Vulnerability"&&t.status!=="Done").length;
    const overdue = tasks.filter(t=>t.status!=="Done"&&isOverdue(t.dueDate)).length;
    if (tab==="Dashboard" && overdue>0) return overdue;
    return 0;
  };

  return (
    <nav className="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur select-none flex-shrink-0 z-40">

              <rect x="1" y="1" width="5" height="5" rx="1" fill="white" opacity="0.9"/>
              <rect x="8" y="1" width="5" height="5" rx="1" fill="white" opacity="0.6"/>
              <rect x="1" y="8" width="5" height="5" rx="1" fill="white" opacity="0.6"/>
              <rect x="8" y="8" width="5" height="5" rx="1" fill="white" opacity="0.9"/>
            </svg>
          </div>
          <span className="font-bold text-white text-sm tracking-tight">
            {settings.appName.slice(0,-5)||"Ops"}
            <span style={{color:settings.accentColor}}>{settings.appName.slice(-5)||"Board"}</span>
          </span>
          {settings.domain && <span className="hidden sm:inline ml-1 text-xs text-slate-500 font-mono bg-slate-800 border border-slate-700 px-1.5 py-0.5 rounded-full">{settings.domain}</span>}
        </div>
        <div className="flex-1"/>
        <div className="flex items-center gap-1.5 flex-shrink-0">
          {showSearch
            ? <SearchBar value={search} onChange={setSearch} onClose={()=>{setShowSearch(false);setSearch("");}}/>
            : <>
                <button onClick={()=>setShowSearch(true)}
                  className="p-1.5 rounded-md text-slate-400 hover:text-white transition-colors" title="Search (/)">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </button>
                <button onClick={onNew}
                  className="flex items-center gap-1 px-2.5 py-1.5 rounded-md text-white text-sm font-medium hover:opacity-90 transition-all shadow-lg"
                  style={{background:settings.accentColor}} title="New Task (N)">
                  <span className="text-base leading-none">+</span>
                  <span className="hidden sm:inline"> New Task</span>
                </button>
                {storageMode && <StorageBadge mode={storageMode}/>}

                {/* Profile dropdown */}
                <div className="relative" ref={profileRef}>
                  <button onClick={()=>setProfileOpen(o=>!o)}
                    className="flex items-center gap-1.5 rounded-full transition-all hover:ring-2 hover:ring-offset-2 hover:ring-offset-slate-900 focus:outline-none"
                    style={profileOpen?{ringColor:settings.accentColor}:{}}
                    title={displayName}>
                    <div className="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white flex-shrink-0 transition-all"
                      style={{background:settings.accentColor+"cc", boxShadow: profileOpen ? `0 0 0 2px ${settings.accentColor}` : "none"}}>
                      {nameInitials}
                    </div>
                  </button>

                  {/* Dropdown menu */}
                  {profileOpen && (
                    <div className="absolute right-0 top-full mt-2 w-56 rounded-xl shadow-2xl z-50 overflow-hidden fade-in"
                      style={{background:"var(--bg-panel)",border:"1px solid rgba(99,102,241,0.2)",backdropFilter:"blur(16px)"}}>

                      {/* User info header */}
                      <div className="px-4 py-3 border-b border-slate-800">
                        <div className="flex items-center gap-3">
                          <div className="w-9 h-9 rounded-full flex items-center justify-center text-sm font-bold text-white flex-shrink-0"
                            style={{background:settings.accentColor+"cc"}}>
                            {nameInitials}
                          </div>
                          <div className="min-w-0">
                            <div className="text-white text-sm font-medium truncate">{displayName}</div>
                            {displayEmail && <div className="text-slate-500 text-xs truncate">{displayEmail}</div>}
                          </div>
                        </div>
                      </div>

                      {/* Menu items */}
                      <div className="py-1.5">
                        <button onClick={onToggleTheme}
                          className="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-slate-300 hover:bg-slate-800/80 hover:text-white transition-colors text-left">
                          <svg className="w-4 h-4 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"/>
                          </svg>
                          {isDark ? "Switch to light mode" : "Switch to dark mode"}
                        </button>
                        <button onClick={()=>{onSettings();setProfileOpen(false);}}
                          className="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-slate-300 hover:bg-slate-800/80 hover:text-white transition-colors text-left">
                          <svg className="w-4 h-4 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>

                        <button onClick={()=>{onDeleteData();setProfileOpen(false);}}

                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M13 7a4 4 0 11-8 0 4 4 0 018 0zM9 14a6 6 0 00-6 6v1h12v-1a6 6 0 00-6-6zM21 12h-6"/>

                    </div>
                  )}
                </div>
              </>
          }
        </div>
      </div>
      {/* Scrollable tab strip */}
      {!showSearch && (
        <div className="flex overflow-x-auto border-t border-slate-800/60" style={{scrollbarWidth:"none",msOverflowStyle:"none"}}>
          {tabs.map(t=>{
            const badge = badgeCount(t);
            return (
              <button key={t} onClick={()=>setActiveTab(t)}
                className={`relative flex-shrink-0 h-10 px-4 text-sm font-medium transition-all border-b-2 whitespace-nowrap ${activeTab===t?"text-indigo-400":"border-transparent text-slate-400 hover:text-slate-200"}`}

// ── Search Results ─────────────────────────────────────────────────────────
function SearchResults({ tasks, query, onSelect, settings }) {
  if (!query.trim()) return null;
  const q = query.toLowerCase();
  const results = tasks.filter(t=>
    t.title.toLowerCase().includes(q)||t.description.toLowerCase().includes(q)||
    t.category.toLowerCase().includes(q)||t.tags.some(tg=>tg.toLowerCase().includes(q))
  ).slice(0,8);
  return (
    <div className="p-4 fade-in">
      <div className="text-xs text-slate-500 mb-3">{results.length} result{results.length!==1?"s":""} for "<span className="text-slate-300">{query}</span>"</div>
      {results.length===0
        ? <div className="text-slate-500 text-sm text-center py-8">No tasks match your search.</div>
        : <div className="flex flex-col gap-2">
            {results.map(t=>(
              <div key={t.id} onClick={()=>onSelect(t.id)}
                className="glass rounded-lg p-3 cursor-pointer hover:border-indigo-500/40 transition-colors">
                <div className="flex items-start justify-between gap-3">
                  <span className="text-slate-200 text-sm font-medium flex-1">{t.title}</span>
                  <div className="flex gap-1.5 flex-shrink-0">
                    <span className={`text-xs px-1.5 py-0.5 rounded-full font-medium ${pc(t.priority)}`}>{t.priority}</span>
                    <span className={`text-xs px-1.5 py-0.5 rounded-full font-medium ${sc(t.status)}`}>{t.status}</span>
                  </div>
                </div>
                <div className="flex items-center gap-2 mt-1.5 text-xs text-slate-500">
                  <span className={cc(t.category)}>{t.category}</span>
                  <span>·</span><span>{t.assignee}</span>
                  {t.dueDate&&<><span>·</span><span className={dueBadge(t.dueDate)?`text-xs px-1.5 rounded ${dueBadge(t.dueDate)}`:""}>{fmtDate(t.dueDate)}</span></>}
                </div>
              </div>
            ))}
          </div>
      }
    </div>
  );
}

// ── Dashboard ──────────────────────────────────────────────────────────────
function Dashboard({ tasks, onSelect, settings }) {
  const open     = tasks.filter(t=>t.status!=="Done");
  const overdue  = open.filter(t=>isOverdue(t.dueDate));
  const dueSoon  = open.filter(t=>isDueSoon(t.dueDate));
  const critical = open.filter(t=>t.priority==="Critical");
  const pct      = tasks.length ? Math.round((tasks.filter(t=>t.status==="Done").length/tasks.length)*100) : 0;
  const r=28, circ=2*Math.PI*r;
  const stats = [
    {label:"Open",value:open.length,color:"text-indigo-400",bg:"bg-indigo-950/60",border:"border-indigo-900/50"},
    {label:"Overdue",value:overdue.length,color:"text-red-400",bg:"bg-red-950/60",border:"border-red-900/50"},
    {label:"Due Soon",value:dueSoon.length,color:"text-orange-400",bg:"bg-orange-950/60",border:"border-orange-900/50"},
    {label:"Critical",value:critical.length,color:"text-pink-400",bg:"bg-pink-950/60",border:"border-pink-900/50"},
  ];
  const byStatus = STATUSES.map(s=>({status:s,count:tasks.filter(t=>t.status===s).length}));
  const recent = [...tasks].sort((a,b)=>b.id-a.id).slice(0,5);
  return (
    <div className="p-4 sm:p-6 fade-in max-w-6xl mx-auto">
      {/* Header */}
      <div className="flex items-center justify-between mb-4">
        <h2 className="text-white font-semibold text-lg">Dashboard</h2>
        <span className="text-slate-500 text-xs">{new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</span>
      </div>

      {/* Stat cards — 2 cols on mobile, 4 on desktop */}
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
        {stats.map(s=>(
          <div key={s.label} className={`${s.bg} border ${s.border} rounded-xl p-4`}>
            <div className={`text-3xl font-bold ${s.color} mb-0.5`}>{s.value}</div>
            <div className="text-slate-400 text-sm">{s.label}</div>
            {s.label==="Overdue"&&s.value>0&&(
              <div className="mt-1.5 flex items-center gap-1 text-xs text-red-400">
                <span className="pulse-dot w-1.5 h-1.5 rounded-full bg-red-500 inline-block"/>
                Needs attention
              </div>
            )}
          </div>
        ))}
      </div>

      {/* Overdue alert — shown early on mobile so it's not buried */}
      {overdue.length>0&&(
        <div className="glass rounded-xl p-4 border border-red-900/50 mb-4">
          <h3 className="text-red-400 font-medium text-sm mb-2 flex items-center gap-2">
            <span className="pulse-dot w-2 h-2 rounded-full bg-red-500 inline-block"/>
            {overdue.length} Overdue Task{overdue.length>1?"s":""}
          </h3>
          <div className="flex flex-col gap-2">
            {overdue.map(t=>(
              <div key={t.id} onClick={()=>onSelect(t.id)}
                className="flex items-center gap-3 cursor-pointer hover:opacity-80">
                <span className={`text-xs px-2 py-0.5 rounded-full font-medium flex-shrink-0 ${pc(t.priority)}`}>{t.priority}</span>
                <span className="text-slate-300 text-sm flex-1 truncate">{t.title}</span>
                <span className="text-red-400 text-xs font-mono flex-shrink-0">{fmtDate(t.dueDate)}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Progress + Status — stack on mobile, side by side on sm+ */}
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
        {/* Progress ring */}
        <div className="glass rounded-xl p-5 flex items-center gap-5">
          <svg width="72" height="72" className="progress-ring flex-shrink-0">
            <circle cx="36" cy="36" r={r} fill="none" stroke="#1e293b" strokeWidth="6"/>
            <circle cx="36" cy="36" r={r} fill="none" stroke={settings.accentColor} strokeWidth="6"
              strokeDasharray={circ} strokeDashoffset={circ*(1-pct/100)} strokeLinecap="round"
              style={{transition:"stroke-dashoffset .6s ease"}}/>
          </svg>
          <div>
            <div className="text-3xl font-bold text-white">{pct}%</div>
            <div className="text-slate-400 text-sm mt-0.5">Completion rate</div>
            <div className="text-slate-500 text-xs mt-1">{tasks.filter(t=>t.status==="Done").length} of {tasks.length} tasks done</div>
          </div>
        </div>

        {/* Status breakdown */}
        <div className="glass rounded-xl p-4">
          <h3 className="text-slate-300 font-medium text-sm mb-3">By Status</h3>
          <div className="flex flex-col gap-2">
            {byStatus.map(({status,count})=>(
              <div key={status} className="flex items-center gap-2">
                <span className={`text-xs px-2 py-0.5 rounded-full font-medium flex-shrink-0 w-20 text-center ${sc(status)}`}>{status}</span>
                <div className="flex-1 bg-slate-800 rounded-full h-1.5">
                  <div className="h-1.5 rounded-full transition-all duration-500" style={{width:tasks.length?`${(count/tasks.length)*100}%`:"0%",background:settings.accentColor}}/>
                </div>
                <span className="text-slate-400 text-xs w-5 text-right flex-shrink-0">{count}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* Recent Activity */}
      <div className="glass rounded-xl p-4 mb-4">
        <h3 className="text-slate-300 font-medium text-sm mb-3">Recent Activity</h3>
        <div className="flex flex-col gap-2">
          {recent.map(t=>(
            <div key={t.id} onClick={()=>onSelect(t.id)}
              className="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity">
              <span className={`text-xs px-2 py-0.5 rounded font-medium flex-shrink-0 ${sc(t.status)}`}>{t.status}</span>
              <span className="text-slate-300 text-sm truncate flex-1">{t.title}</span>
            </div>
          ))}
        </div>
      </div>

      {/* Tasks by Category */}
      <div className="glass rounded-xl p-4">
        <h3 className="text-slate-300 font-medium text-sm mb-3">Tasks by Category</h3>
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2">
          {settings.categories.map(cat=>{
            const all=tasks.filter(t=>t.category===cat);
            const done=all.filter(t=>t.status==="Done").length;
            if(!all.length)return null;
            return (
              <div key={cat} className="bg-slate-800/60 border border-slate-700/50 rounded-lg px-3 py-2.5">
                <div className={`text-xs font-medium ${cc(cat)} mb-1.5 truncate`}>{cat}</div>
                <div className="flex items-baseline gap-1.5 mb-1.5">
                  <span className="text-white font-bold text-xl">{all.length}</span>
                  <span className="text-slate-500 text-xs">{done} done</span>
                </div>
                <div className="bg-slate-700 rounded-full h-1">
                  <div className="h-1 rounded-full" style={{width:all.length?`${(done/all.length)*100}%`:"0%",background:settings.accentColor}}/>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ── Quick Filters ──────────────────────────────────────────────────────────
function QuickFilters({ active, setActive, tasks, settings }) {
  const chips = [
    {id:"all",label:"All"},
    {id:"mine",label:"My Tasks"},
    {id:"overdue",label:"Overdue"},
    {id:"due-today",label:"Due Today"},
    {id:"due-week",label:"Due This Week"},
    {id:"no-assignee",label:"Unassigned"},
  ];
  return (
    <div className="flex items-center gap-1.5 flex-wrap">
      {chips.map(c=>(
        <button key={c.id} onClick={()=>setActive(c.id)}
          className={`text-xs px-2.5 py-1 rounded-full font-medium transition-all border ${active===c.id?"text-white border-transparent":"bg-slate-800/60 text-slate-400 border-slate-700/50 hover:text-slate-200"}`}
          style={active===c.id?{background:settings.accentColor,borderColor:settings.accentColor}:{}}>
          {c.label}
        </button>
      ))}
    </div>
  );
}

// ── Backlog ────────────────────────────────────────────────────────────────
function Backlog({ tasks, onSelect, selectedId, settings, toast }) {
  const [filterCat, setFilterCat]     = useState("All");
  const [filterStatus, setFilterStatus] = useState("All");
  const [sort, setSort]               = useState("id");
  const [sortDir, setSortDir]         = useState("desc");
  const [quickFilter, setQuickFilter] = useState("all");
  const allCats = ["All",...settings.categories];
  const todayStr = today();
  const weekEnd  = new Date(); weekEnd.setDate(weekEnd.getDate()+7);
  const weekStr  = weekEnd.toISOString().slice(0,10);

  let filtered = tasks.filter(t=>
    (filterCat==="All"||t.category===filterCat)&&
    (filterStatus==="All"||t.status===filterStatus)
  );
  if (quickFilter==="mine")       filtered=filtered.filter(t=>t.assignee===settings.assignees[0]);
  if (quickFilter==="overdue")    filtered=filtered.filter(t=>t.status!=="Done"&&isOverdue(t.dueDate));
  if (quickFilter==="due-today")  filtered=filtered.filter(t=>t.dueDate===todayStr);
  if (quickFilter==="due-week")   filtered=filtered.filter(t=>t.dueDate&&t.dueDate>=todayStr&&t.dueDate<=weekStr);
  if (quickFilter==="no-assignee")filtered=filtered.filter(t=>t.assignee==="Unassigned");

  const sortFns = {
    id:(a,b)=>a.id-b.id, title:(a,b)=>a.title.localeCompare(b.title),
    priority:(a,b)=>PRIORITIES.indexOf(a.priority)-PRIORITIES.indexOf(b.priority),
    status:(a,b)=>STATUSES.indexOf(a.status)-STATUSES.indexOf(b.status),
    dueDate:(a,b)=>(a.dueDate||"9999")>(b.dueDate||"9999")?1:-1,
  };
  filtered = [...filtered].sort((a,b)=>(sortDir==="asc"?1:-1)*(sortFns[sort]||sortFns.id)(a,b));

  const toggleSort = col => { if(sort===col)setSortDir(d=>d==="asc"?"desc":"asc"); else{setSort(col);setSortDir("asc");} };
  const SortIcon = ({col})=> sort===col ? <span className="text-slate-400">{sortDir==="asc"?"↑":"↓"}</span> : <span className="text-slate-700">↕</span>;

  return (
    <div className="fade-in flex flex-col h-full">
      <div className="flex items-center gap-3 px-5 py-2.5 border-b border-slate-800/60 bg-slate-900/50 flex-shrink-0 flex-wrap gap-y-2">
        <QuickFilters active={quickFilter} setActive={setQuickFilter} tasks={tasks} settings={settings}/>
        <div className="ml-auto flex items-center gap-2">
          <select value={filterCat} onChange={e=>setFilterCat(e.target.value)}
            className="bg-slate-800 border border-slate-700 text-slate-300 text-xs rounded-md px-2 py-1">
            {allCats.map(c=><option key={c}>{c}</option>)}
          </select>
          <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}
            className="bg-slate-800 border border-slate-700 text-slate-300 text-xs rounded-md px-2 py-1">
            <option>All</option>{STATUSES.map(s=><option key={s}>{s}</option>)}
          </select>

// ── Settings ───────────────────────────────────────────────────────────────
function Settings({ settings, onSave, tasks, onImportTasks, onResetTasks, onClearTasks, toast }) {
  const [draft,setDraft]     = useState({...DEFAULT_SETTINGS,...settings});
  const [newAssignee,setNA]  = useState("");
  const [newCategory,setNC]  = useState("");
  const [saved,setSaved]     = useState(false);
  const [section,setSection] = useState("General");
  const [confirm,setConfirm] = useState(null);
  const fileRef = useRef();

  // Keep draft in sync if settings change externally
  useEffect(()=>{ setDraft({...DEFAULT_SETTINGS,...settings}); },[settings]);

  const upd = (k,v) => setDraft(d=>({...d,[k]:v}));
  const addA = () => { const v=newAssignee.trim(); if(!v||draft.assignees.includes(v))return; upd("assignees",[...draft.assignees,v]); setNA(""); };
  const addC = () => { const v=newCategory.trim(); if(!v||draft.categories.includes(v))return; upd("categories",[...draft.categories,v]); setNC(""); };
  const save = () => {
    onSave(draft);
    // Persist 2FA setting to the server so login can check it
    if (draft.twoFaEnabled !== settings.twoFaEnabled) {
      AuthService.updateProfile({ twoFaEnabled: draft.twoFaEnabled });
    }
    setSaved(true); toast("Settings saved","success"); setTimeout(()=>setSaved(false),1500);
  };

  const doExport = () => {
    const blob = new Blob([JSON.stringify({tasks,settings},null,2)],{type:"application/json"});
    const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="opsboard-backup.json"; a.click();
    toast("Backup exported","success");
  };
  const doImport = e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if(d.tasks) onImportTasks(d.tasks);
        if(d.settings) onSave(d.settings);
        toast("Import successful","success");
      } catch { toast("Invalid file format","error"); }
    };
    reader.readAsText(file); e.target.value="";
  };

  // Stats derived from tasks
  const totalTasks   = tasks.length;
  const doneTasks    = tasks.filter(t=>t.status==="Done").length;
  const overdueTasks = tasks.filter(t=>t.status!=="Done"&&isOverdue(t.dueDate)).length;
  const criticalOpen = tasks.filter(t=>t.priority==="Critical"&&t.status!=="Done").length;
  const completionPct = totalTasks ? Math.round((doneTasks/totalTasks)*100) : 0;
  const byCategory = settings.categories.map(c=>({ name:c, count:tasks.filter(t=>t.category===c).length })).filter(x=>x.count>0).sort((a,b)=>b.count-a.count);
  const byAssignee = settings.assignees.map(a=>({ name:a, count:tasks.filter(t=>t.assignee===a&&t.status!=="Done").length })).filter(x=>x.count>0).sort((a,b)=>b.count-a.count);

  const inputCls = "w-full bg-slate-800 border border-slate-700 text-white text-sm rounded-md px-3 py-2 focus:border-indigo-500 transition-colors";
  const selectCls = "w-full bg-slate-800 border border-slate-700 text-slate-300 text-sm rounded-md px-3 py-2 focus:border-indigo-500 transition-colors";

  const Toggle = ({value, onChange, label, desc}) => (
    <div className="flex items-center justify-between py-3 border-b border-slate-800/60 last:border-0">
      <div>
        <div className="text-slate-200 text-sm">{label}</div>
        {desc && <div className="text-slate-500 text-xs mt-0.5">{desc}</div>}
      </div>
      <button onClick={()=>onChange(!value)}
        className="relative w-10 h-5 rounded-full transition-colors flex-shrink-0 ml-4"
        style={{background:value?draft.accentColor:"#1e293b"}}>
        <span className="absolute top-0.5 transition-all w-4 h-4 rounded-full bg-white shadow"
          style={{left:value?"calc(100% - 18px)":"2px"}}/>
      </button>
    </div>
  );

  const sections = ["General","Profile","Team","Categories","Task Defaults","Notifications","Stats","Data","Shortcuts"];

  return (
    <div className="fade-in flex h-full">
      {/* Sidebar */}
      <div className="w-48 border-r p-4 flex-shrink-0 overflow-y-auto" style={{borderColor:"var(--border)"}}>
        <div className="text-xs text-slate-500 uppercase tracking-wide mb-3">Settings</div>
        {sections.map(s=>(
          <button key={s} onClick={()=>setSection(s)}
            className={`w-full text-left px-3 py-2 rounded-md text-sm mb-0.5 transition-colors ${section===s?"bg-slate-800 text-white":"text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`}>
            {s}
          </button>
        ))}
        <div className="mt-4 pt-4 border-t border-slate-800/60">
          <button onClick={save}
            className={`w-full py-2 rounded-md text-sm font-semibold transition-colors ${saved?"bg-emerald-600 text-white":"text-white hover:opacity-90"}`}
            style={saved?{}:{background:settings.accentColor}}>
            {saved?"Saved ✓":"Save Changes"}
          </button>
        </div>
      </div>

      {/* Content */}
      <div className="flex-1 overflow-y-auto p-6">

        {/* ── General ── */}

                <label className="text-xs text-slate-500 uppercase tracking-wide mb-1 block">Custom Domain</label>
                <div className="flex items-center bg-slate-800 border border-slate-700 rounded-md overflow-hidden focus-within:border-indigo-500 transition-colors">
                  <span className="pl-3 text-slate-500 text-sm select-none">https://</span>
                  <input value={draft.domain} onChange={e=>upd("domain",e.target.value.replace(/^https?:\/\//,""))}
                    className="flex-1 bg-transparent text-white text-sm px-1 py-2 font-mono" placeholder="yourboard.com"/>
                </div>

              <div>
                <label className="text-xs text-slate-500 uppercase tracking-wide mb-2 block">Accent Colour</label>

                  <input type="color" value={draft.accentColor} onChange={e=>upd("accentColor",e.target.value)}

                  style={{background:draft.accentColor+"cc"}}>
                  {draft.initials||"?"}

                <div>
                  <div className="text-white font-medium">{draft.userName||"Your name"}</div>
                  <div className="text-slate-500 text-sm mt-0.5">{draft.initials||"--"} · {draft.appName}</div>
                </div>

              <div className="flex gap-4 mb-4">
                <div className="flex-1">
                  <label className="text-xs text-slate-500 uppercase tracking-wide mb-1 block">Display Name</label>

              <div className="flex gap-2">
                <input value={newCategory} onChange={e=>setNC(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addC()}
                  placeholder="New category…" className="flex-1 bg-slate-800 border border-slate-700 text-white text-sm rounded-md px-3 py-2 focus:border-indigo-500 transition-colors"/>
                <button onClick={addC} className="px-4 py-2 rounded-md text-white text-sm font-medium hover:opacity-90" style={{background:draft.accentColor}}>Add</button>
              </div>
            </div>
            <div className="glass rounded-xl p-4">
              <div className="text-xs text-slate-500">Incident and Vulnerability categories feed the dedicated tab views. Removing them hides those tabs.</div>
            </div>
          </div>
        )}

        {/* ── Task Defaults ── */}
        {section==="Task Defaults"&&(
          <div className="fade-in max-w-lg">
            <h2 className="text-white font-semibold text-lg mb-1">Task Defaults</h2>
            <p className="text-slate-400 text-sm mb-5">Pre-fill values when creating new tasks.</p>
            <div className="glass rounded-xl p-5 mb-4">
              <h3 className="text-slate-300 text-sm font-medium mb-4">New Task Defaults</h3>
              <div className="mb-4">
                <label className="text-xs text-slate-500 uppercase tracking-wide mb-1 block">Default Priority</label>
                <select value={draft.defaultPriority} onChange={e=>upd("defaultPriority",e.target.value)} className={selectCls}>
                  {["Critical","High","Medium","Low"].map(p=><option key={p}>{p}</option>)}
                </select>
              </div>
              <div className="mb-4">
                <label className="text-xs text-slate-500 uppercase tracking-wide mb-1 block">Default Category</label>
                <select value={draft.defaultCategory} onChange={e=>upd("defaultCategory",e.target.value)} className={selectCls}>
                  {draft.categories.map(c=><option key={c}>{c}</option>)}
                </select>
              </div>
              <div>
                <label className="text-xs text-slate-500 uppercase tracking-wide mb-1 block">Default Assignee</label>
                <select value={draft.defaultAssignee} onChange={e=>upd("defaultAssignee",e.target.value)} className={selectCls}>
                  {draft.assignees.map(a=><option key={a}>{a}</option>)}
                </select>
              </div>
            </div>
            <div className="glass rounded-xl p-5">
              <h3 className="text-slate-300 text-sm font-medium mb-4">SLA Thresholds</h3>
              <p className="text-slate-500 text-xs mb-4">Tasks without a due date will be considered overdue after this many days based on priority.</p>
              {[["Critical","slaCritical"],["High","slaHigh"],["Medium","slaMedium"],["Low","slaLow"]].map(([label,key])=>(
                <div key={key} className="flex items-center justify-between py-2.5 border-b border-slate-800/60 last:border-0">
                  <span className="text-slate-300 text-sm">{label}</span>
                  <div className="flex items-center gap-2">
                    <input type="number" min="1" max="365" value={draft[key]}
                      onChange={e=>upd(key,parseInt(e.target.value)||1)}
                      className="w-16 bg-slate-800 border border-slate-700 text-white text-sm rounded-md px-2 py-1 text-center focus:border-indigo-500 transition-colors"/>
                    <span className="text-slate-500 text-xs">days</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ── Notifications ── */}
        {section==="Notifications"&&(
          <div className="fade-in max-w-lg">
            <h2 className="text-white font-semibold text-lg mb-1">Notifications</h2>
            <p className="text-slate-400 text-sm mb-5">Control what appears on your dashboard and badges.</p>
            <div className="glass rounded-xl p-5 mb-4">
              <h3 className="text-slate-300 text-sm font-medium mb-3">Dashboard Alerts</h3>
              <Toggle value={draft.notifyOverdue} onChange={v=>upd("notifyOverdue",v)} label="Overdue task alerts" desc="Show overdue banner on Dashboard"/>
              <Toggle value={draft.notifyDueSoon} onChange={v=>upd("notifyDueSoon",v)} label="Due soon alerts" desc="Warn when tasks are approaching their due date"/>
              {draft.notifyDueSoon&&(
                <div className="pt-3 fade-in">
                  <label className="text-xs text-slate-500 uppercase tracking-wide mb-1 block">Due soon window</label>
                  <div className="flex items-center gap-2">
                    <input type="number" min="1" max="30" value={draft.dueSoonDays}
                      onChange={e=>upd("dueSoonDays",parseInt(e.target.value)||1)}
                      className="w-20 bg-slate-800 border border-slate-700 text-white text-sm rounded-md px-2 py-2 text-center focus:border-indigo-500 transition-colors"/>
                    <span className="text-slate-400 text-sm">days before due date</span>
                  </div>
                </div>
              )}
            </div>
          </div>
        )}

        {/* ── Stats ── */}
        {section==="Stats"&&(
          <div className="fade-in max-w-lg">
            <h2 className="text-white font-semibold text-lg mb-1">Stats</h2>
            <p className="text-slate-400 text-sm mb-5">Overview of your board health.</p>
            <div className="grid grid-cols-2 gap-3 mb-4">
              {[
                {label:"Total tasks",   value:totalTasks,     color:"text-indigo-400"},
                {label:"Completed",     value:doneTasks,      color:"text-emerald-400"},
                {label:"Overdue",       value:overdueTasks,   color:"text-red-400"},
                {label:"Critical open", value:criticalOpen,   color:"text-pink-400"},
              ].map(s=>(
                <div key={s.label} className="glass rounded-xl p-4">
                  <div className={`text-3xl font-bold ${s.color} mb-1`}>{s.value}</div>
                  <div className="text-slate-400 text-xs">{s.label}</div>
                </div>
              ))}
            </div>
            <div className="glass rounded-xl p-5 mb-4">
              <div className="flex items-center justify-between mb-3">
                <h3 className="text-slate-300 text-sm font-medium">Completion rate</h3>
                <span className="text-white font-bold text-lg">{completionPct}%</span>
              </div>
              <div className="w-full bg-slate-800 rounded-full h-2">
                <div className="h-2 rounded-full transition-all duration-700" style={{width:`${completionPct}%`,background:settings.accentColor}}/>
              </div>
            </div>
            {byCategory.length>0&&(
              <div className="glass rounded-xl p-5 mb-4">
                <h3 className="text-slate-300 text-sm font-medium mb-3">Tasks by category</h3>
                {byCategory.map(({name,count})=>(
                  <div key={name} className="flex items-center gap-3 mb-2">
                    <span className={`text-xs font-medium w-28 flex-shrink-0 ${cc(name)}`}>{name}</span>
                    <div className="flex-1 bg-slate-800 rounded-full h-1.5">
                      <div className="h-1.5 rounded-full" style={{width:`${(count/totalTasks)*100}%`,background:settings.accentColor}}/>
                    </div>
                    <span className="text-slate-400 text-xs w-6 text-right">{count}</span>
                  </div>
                ))}
              </div>
            )}
            {byAssignee.length>0&&(
              <div className="glass rounded-xl p-5 mb-4">
                <h3 className="text-slate-300 text-sm font-medium mb-3">Open tasks by assignee</h3>
                {byAssignee.map(({name,count})=>(
                  <div key={name} className="flex items-center gap-3 mb-2">
                    <div className="w-5 h-5 rounded-full flex items-center justify-center text-xs text-white font-bold flex-shrink-0"
                      style={{background:settings.accentColor+"99"}}>{initials(name)}</div>
                    <span className="text-slate-300 text-xs flex-1 truncate">{name}</span>
                    <span className="text-slate-400 text-xs">{count} open</span>
                  </div>
                ))}
              </div>
            )}
            <div className="glass rounded-xl p-4">
              <div className="flex gap-4 text-xs">
                <div><span className="text-white font-bold">{tasks.filter(t=>t.checklist?.length>0).length}</span><span className="text-slate-400 ml-1">tasks with checklists</span></div>
                <div><span className="text-white font-bold">{(JSON.stringify({tasks,settings}).length/1024).toFixed(1)} KB</span><span className="text-slate-400 ml-1">total data size</span></div>
              </div>
            </div>
          </div>
        )}

        {/* ── Data ── */}
        {section==="Data"&&(
          <div className="fade-in max-w-lg">
            <h2 className="text-white font-semibold text-lg mb-1">Data Management</h2>
            <p className="text-slate-400 text-sm mb-5">Export, import, or reset your board data.</p>
            <div className="glass rounded-xl p-5 mb-3">
              <h3 className="text-slate-300 text-sm font-medium mb-1">Export</h3>
              <p className="text-slate-500 text-xs mb-3">Download all tasks and settings as a JSON backup file.</p>
              <button onClick={doExport} className="px-4 py-2 rounded-md text-white text-sm font-medium hover:opacity-90" style={{background:draft.accentColor}}>
                Export Backup (JSON)
              </button>
            </div>
            <div className="glass rounded-xl p-5 mb-3">
              <h3 className="text-slate-300 text-sm font-medium mb-1">Import</h3>
              <p className="text-slate-500 text-xs mb-3">Restore from a JSON backup. Overwrites all current tasks and settings.</p>
              <input ref={fileRef} type="file" accept=".json" onChange={doImport} className="hidden"/>
              <button onClick={()=>fileRef.current.click()} className="px-4 py-2 rounded-md text-slate-200 text-sm font-medium bg-slate-800 hover:bg-slate-700 border border-slate-700">
                Import from JSON
              </button>
            </div>
            <div className="glass rounded-xl p-5 mb-3 border border-orange-900/40">
              <h3 className="text-slate-300 text-sm font-medium mb-1">Clear All Tasks</h3>
              <p className="text-slate-500 text-xs mb-3">Permanently delete every task. Settings are kept. Cannot be undone.</p>
              <button onClick={()=>setConfirm({title:"Clear all tasks?",message:"Every task will be permanently deleted. Your settings will be kept.",confirmLabel:"Clear All Tasks",onConfirm:()=>{onClearTasks();setConfirm(null);toast("All tasks cleared","warn");}})}
                className="px-4 py-2 rounded-md text-orange-300 text-sm font-medium bg-orange-950 hover:bg-orange-900 border border-orange-900">
                Clear Tasks
              </button>
            </div>
            <div className="glass rounded-xl p-5 border border-red-900/40">
              <h3 className="text-slate-300 text-sm font-medium mb-1">Reset Everything</h3>
              <p className="text-slate-500 text-xs mb-3">Delete all tasks and reset all settings to defaults. Cannot be undone.</p>
              <button onClick={()=>setConfirm({title:"Reset everything?",message:"All tasks will be deleted and all settings reset to defaults. This cannot be undone.",confirmLabel:"Reset Everything",onConfirm:()=>{onClearTasks();onSave(DEFAULT_SETTINGS);setConfirm(null);toast("Board reset to defaults","error");}})}
                className="px-4 py-2 rounded-md text-red-400 text-sm font-medium bg-red-950 hover:bg-red-900 border border-red-900">
                Reset Everything
              </button>
            </div>
          </div>
        )}

        {/* ── Shortcuts ── */}
        {section==="Shortcuts"&&(
          <div className="fade-in max-w-lg">
            <h2 className="text-white font-semibold text-lg mb-1">Keyboard Shortcuts</h2>
            <p className="text-slate-400 text-sm mb-5">Speed up your workflow without touching the mouse.</p>
            <div className="glass rounded-xl p-5">
              {[
                ["Navigation",""],
                ["D","Go to Dashboard"],
                ["B","Go to Backlog"],
                ["I","Go to Incidents"],
                ["V","Go to Vulnerabilities"],
                ["S","Go to Settings"],
                ["Tasks",""],
                ["N","New task"],
                ["Esc","Close panel / dismiss"],
                ["Search",""],
                ["/ or Ctrl+K","Open search"],
                ["Esc","Close search"],
              ].map(([key,desc])=> key&&!desc
                ? <div key={key} className="text-xs text-slate-500 uppercase tracking-wide pt-4 pb-1 first:pt-0">{key}</div>
                : (
                  <div key={key+desc} className="flex items-center justify-between py-2.5 border-b border-slate-800/60 last:border-0">
                    <span className="text-slate-300 text-sm">{desc}</span>
                    <span className="kbd">{key}</span>
                  </div>
                )
              )}
            </div>
          </div>
        )}

      </div>
      {confirm&&<ConfirmModal {...confirm} danger={true} accentColor={draft.accentColor} onCancel={()=>setConfirm(null)}/>}
    </div>
  );
}

// ── Detail Panel ───────────────────────────────────────────────────────────
function DetailPanel({ task, onUpdate, onDelete, onClose, settings, toast }) {
  const [title,setTitle]         = useState(task.title);
  const [description,setDesc]    = useState(task.description);
  const [status,setStatus]       = useState(task.status);
  const [priority,setPriority]   = useState(task.priority);
  const [category,setCategory]   = useState(task.category);
  const [assignee,setAssignee]   = useState(task.assignee);
  const [dueDate,setDueDate]     = useState(task.dueDate);
  const [checklist,setChecklist] = useState(task.checklist);
  const [notes,setNotes]         = useState(task.notes||"");
  const [newCheck,setNewCheck]   = useState("");
  const [newTag,setNewTag]       = useState("");
  const [tags,setTags]           = useState(task.tags||[]);
  const [saved,setSaved]         = useState(false);
  const [tab,setTab]             = useState("detail");
  const [confirmDelete,setConfirmDelete] = useState(false);

  useEffect(()=>{
    setTitle(task.title);setDesc(task.description);setStatus(task.status);
    setPriority(task.priority);setCategory(task.category);setAssignee(task.assignee);
    setDueDate(task.dueDate);setChecklist(task.checklist);setNotes(task.notes||"");setTags(task.tags||[]);
  },[task.id]);

  const save=()=>{
    onUpdate({...task,title,description,status,priority,category,assignee,dueDate,checklist,notes,tags});
    setSaved(true);toast("Task saved","success");setTimeout(()=>setSaved(false),1500);
  };
  const toggleCheck=id=>setChecklist(cl=>cl.map(c=>c.id===id?{...c,done:!c.done}:c));
  const addCheck=()=>{if(!newCheck.trim())return;setChecklist(cl=>[...cl,{id:Date.now(),text:newCheck.trim(),done:false}]);setNewCheck("");};
  const removeCheck=id=>setChecklist(cl=>cl.filter(c=>c.id!==id));
  const addTag=()=>{const v=newTag.trim();if(!v||tags.includes(v))return;setTags(t=>[...t,v]);setNewTag("");};
  const removeTag=t=>setTags(ts=>ts.filter(x=>x!==t));
  const done=checklist.filter(c=>c.done).length;
  const db=dueBadge(dueDate);

  return (
    <div className="w-80 flex-shrink-0 border-l border-slate-800/60 flex flex-col slide-in" style={{background:"var(--bg-panel)"}}>
      {/* Header */}
      <div className="flex items-center justify-between px-4 py-2.5 border-b border-slate-800/60 flex-shrink-0">
        <div className="flex gap-1">
          {["detail","notes","time"].map(t=>{
            const totalMins=(task.timeEntries||[]).reduce((s,e)=>s+e.minutes,0);
            const fmtTotal=m=>{const h=Math.floor(m/60),mn=m%60;return h>0?`${h}h${mn>0?" "+mn+"m":""}`:mn+"m";};
            return (
              <button key={t} onClick={()=>setTab(t)}
                className={`text-xs px-2.5 py-1 rounded-md font-medium transition-colors capitalize ${tab===t?"text-white":"text-slate-500 hover:text-slate-300"}`}
                style={tab===t?{background:settings.accentColor+"33",color:settings.accentColor}:{}}>
                {t==="notes"?(notes?"notes *":"notes"):t==="time"?(totalMins>0?`time (${fmtTotal(totalMins)})`:"time"):"detail"}
              </button>
            );
          })}
        </div>
        <div className="flex items-center gap-1.5">
          <button onClick={()=>{navigator.clipboard?.writeText(`#${task.id} ${task.title}`);toast("Copied to clipboard","info");}}
            className="text-slate-600 hover:text-slate-400 text-xs px-1.5 py-0.5 rounded hover:bg-slate-800 transition-colors" title="Copy task ID">#{task.id}</button>
          <button onClick={onClose} className="text-slate-500 hover:text-slate-300 w-6 h-6 flex items-center justify-center rounded hover:bg-slate-800 transition-colors">✕</button>
        </div>
      </div>

      {tab==="detail"&&(
        <div className="flex-1 overflow-y-auto">
          {/* Title */}
          <div className="px-4 pt-3 pb-2">
            <input value={title} onChange={e=>setTitle(e.target.value)}
              className="w-full bg-transparent text-white text-sm font-semibold border-b border-slate-700 pb-1 focus:border-indigo-500 transition-colors"
              placeholder="Task title"/>
          </div>
          {/* Due date warning */}
          {db&&<div className={`mx-4 mb-2 text-xs px-2.5 py-1.5 rounded-md font-medium ${db}`}>
            {isOverdue(dueDate)?"Overdue — "+fmtDate(dueDate):"Due soon — "+fmtDate(dueDate)}
          </div>}
          {/* Description */}
          <div className="px-4 py-2">
            <label className="text-xs text-slate-500 uppercase tracking-wide mb-1 block">Description</label>
            <textarea value={description} onChange={e=>setDesc(e.target.value)} rows={4}
              className="w-full bg-slate-800/60 border border-slate-700/60 text-slate-300 text-xs rounded-lg p-2.5 resize-none focus:border-indigo-500 transition-colors"
              placeholder="Task description…"/>
          </div>
          {/* Checklist */}
          <div className="px-4 py-2">
            <div className="flex items-center justify-between mb-1">
              <label className="text-xs text-slate-500 uppercase tracking-wide">Checklist</label>
              {checklist.length>0&&<span className="text-xs text-slate-500">{done}/{checklist.length}</span>}
            </div>
            {checklist.length>0&&<div className="mb-2 bg-slate-800 rounded-full h-1"><div className="h-1 rounded-full transition-all" style={{width:`${(done/checklist.length)*100}%`,background:settings.accentColor}}/></div>}
            <div className="flex flex-col gap-1 mt-1">
              {checklist.map(c=>(
                <div key={c.id} className="flex items-center gap-2 group py-0.5">
                  <input type="checkbox" checked={c.done} onChange={()=>toggleCheck(c.id)} className="flex-shrink-0" style={{accentColor:settings.accentColor}}/>
                  <span className={`text-xs flex-1 ${c.done?"line-through text-slate-500":"text-slate-300"}`}>{c.text}</span>
                  <button onClick={()=>removeCheck(c.id)} className="opacity-0 group-hover:opacity-100 text-slate-600 hover:text-red-400 text-xs transition-all">✕</button>
                </div>
              ))}
            </div>
            <div className="flex gap-1 mt-2">
              <input value={newCheck} onChange={e=>setNewCheck(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addCheck()}
                className="flex-1 bg-slate-800/60 border border-slate-700/60 text-slate-300 text-xs rounded-lg px-2 py-1.5 focus:border-indigo-500 transition-colors"
                placeholder="Add item…"/>
              <button onClick={addCheck} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg transition-colors">+</button>
            </div>
          </div>
          {/* Tags */}
          <div className="px-4 py-2">
            <label className="text-xs text-slate-500 uppercase tracking-wide mb-1.5 block">Tags</label>
            <div className="flex flex-wrap gap-1 mb-1.5">
              {tags.map(tag=>(
                <span key={tag} className="flex items-center gap-1 text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full border border-slate-700 group cursor-pointer" onClick={()=>removeTag(tag)}>
                  {tag}<span className="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-red-400 transition-all">✕</span>
                </span>
              ))}
            </div>
            <div className="flex gap-1">
              <input value={newTag} onChange={e=>setNewTag(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTag()}
                className="flex-1 bg-slate-800/60 border border-slate-700/60 text-slate-300 text-xs rounded-lg px-2 py-1.5 focus:border-indigo-500 transition-colors"
                placeholder="Add tag…"/>
              <button onClick={addTag} className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded-lg transition-colors">+</button>
            </div>
          </div>
          {/* Divider */}
          <div className="border-t border-slate-800/60 mx-4 my-2"/>
          {/* Actions */}
          <div className="px-4 flex flex-col gap-2">
            <button onClick={save}
              className={`w-full py-2 rounded-lg text-sm font-semibold transition-colors ${saved?"bg-emerald-600 text-white":"text-white hover:opacity-90"}`}
              style={saved?{}:{background:settings.accentColor}}>
              {saved?"Saved ✓":"Save"}
            </button>
            {status!=="Done"&&(
              <button onClick={()=>{setStatus("Done");onUpdate({...task,title,description,status:"Done",priority,category,assignee,dueDate,checklist,notes,tags});toast("Task marked done","success");}}
                className="w-full py-2 rounded-lg text-sm font-medium bg-emerald-950 hover:bg-emerald-900 text-emerald-300 border border-emerald-800/60">
                Mark as Done ✓
              </button>
            )}
            <div className="grid grid-cols-2 gap-2">
              <button onClick={()=>setConfirmDelete(true)}
                className="py-2 rounded-lg text-xs font-medium bg-red-950/80 hover:bg-red-900 text-red-400 border border-red-900/60">Delete</button>
              <button onClick={onClose}
                className="py-2 rounded-lg text-xs font-medium bg-slate-800/80 hover:bg-slate-700 text-slate-400 border border-slate-700/60">Close</button>
            </div>
          </div>
          <div className="border-t border-slate-800/60 mx-4 my-3"/>
          {/* Metadata */}
          <div className="px-4 flex flex-col gap-3 pb-5">
            {[
              {label:"Status",value:status,set:setStatus,opts:STATUSES},
              {label:"Priority",value:priority,set:setPriority,opts:PRIORITIES},
              {label:"Category",value:category,set:setCategory,opts:settings.categories},
              {label:"Assignee",value:assignee,set:setAssignee,opts:settings.assignees},
            ].map(({label,value,set,opts})=>(
              <div key={label}>
                <label className="text-xs text-slate-500 uppercase tracking-wide mb-1 block">{label}</label>
                <select value={value} onChange={e=>set(e.target.value)}
                  className="w-full bg-slate-800/60 border border-slate-700/60 text-slate-300 text-sm rounded-lg px-2 py-1.5 focus:border-indigo-500 transition-colors">
                  {opts.map(o=><option key={o}>{o}</option>)}
                </select>
              </div>
            ))}
            <div>
              <label className="text-xs text-slate-500 uppercase tracking-wide mb-1 block">Due Date</label>
              <input type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)}
                className="w-full bg-slate-800/60 border border-slate-700/60 text-slate-300 text-sm rounded-lg px-2 py-1.5 focus:border-indigo-500 transition-colors"/>
            </div>
            <div className="text-xs text-slate-700">Created {task.createdAt}</div>
          </div>
        </div>
      )}

      {tab==="notes"&&(
        <div className="flex-1 flex flex-col p-4">
          <label className="text-xs text-slate-500 uppercase tracking-wide mb-2">Notes</label>
          <textarea value={notes} onChange={e=>setNotes(e.target.value)}
            className="flex-1 bg-slate-800/40 border border-slate-700/60 text-slate-300 text-sm rounded-xl p-3 resize-none focus:border-indigo-500 transition-colors"
            placeholder="Free-form notes, post-mortem details, links…"/>
          <button onClick={save}
            className={`mt-3 py-2 rounded-lg text-sm font-semibold transition-colors ${saved?"bg-emerald-600 text-white":"text-white hover:opacity-90"}`}
            style={saved?{}:{background:settings.accentColor}}>
            {saved?"Saved ✓":"Save Notes"}
          </button>
        </div>
      )}

      {tab==="time"&&(
        <TimeTracker task={task} onUpdate={onUpdate} settings={settings}/>
      )}

      {confirmDelete&&(
        <ConfirmModal title="Delete task?" message={`"${task.title}" will be permanently removed.`}
          confirmLabel="Delete" danger={true} accentColor={settings.accentColor}
          onConfirm={()=>{setConfirmDelete(false);onDelete(task.id);toast("Task deleted","error");}}
          onCancel={()=>setConfirmDelete(false)}/>
      )}
    </div>
  );
}
